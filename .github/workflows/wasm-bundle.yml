name: Matched Wasm bundle

# Called by each native release workflow. The artifact belongs to that caller's
# run; no release/tag-name lookup can select an older beta's client.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Match the native release version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          CURRENT=$(tr -d '[:space:]' < versioncode.txt)
          echo "$((CURRENT + 1))" > versioncode.txt

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0

      - name: Install matching host Qt tools
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: '6.12.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtremoteobjects qtshadertools qtquick3d qtgraphs'
          dir: ${{ runner.temp }}/qt-wasm-sdk
          cache: true
          cache-key-prefix: qt-wasm-host-6.12.0-v1

      - name: Remember host tools
        run: echo "DECENZA_WASM_HOST_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install single-threaded Qt Wasm SDK
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: '6.12.0'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: 'qtquick3d qtshadertools qtgraphs qtwebsockets qtimageformats'
          dir: ${{ runner.temp }}/qt-wasm-sdk
          cache: true
          cache-key-prefix: qt-wasm-singlethread-6.12.0-v1

      - name: Install Emscripten 5.0.5
        # Qt 6.12's binary SDK requires this ABI: https://doc.qt.io/qt-6.12/wasm.html
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.5

      - name: Fetch stock Qt module sources
        run: |
          python -m aqt install-src linux 6.12.0 --outputdir "$RUNNER_TEMP/qt-wasm-sdk/Qt" --archives qtmultimedia qtremoteobjects

      - name: Build stock Multimedia and Remote Objects for Wasm
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          QT_SOURCES="$RUNNER_TEMP/qt-wasm-sdk/Qt/6.12.0/Src"
          cmake -S tools/qtmodules-wasm -B build/ci-wasm-multimedia -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$DECENZA_WASM_HOST_QT" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DQT_MULTIMEDIA_SOURCE_DIR="$QT_SOURCES/qtmultimedia" \
            -DQT_MULTIMEDIA_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/qtmultimedia-wasm-install"
          cmake --build build/ci-wasm-multimedia --target qtmultimedia --parallel 2

          # Same stock source and isolated-prefix configure as the recorded
          # Qt Creator probe (tools/qtremoteobjects-probe/README.md).
          grep -Eq '^set\(QT_REPO_MODULE_VERSION "6\.12\.0"\)' "$QT_SOURCES/qtremoteobjects/.cmake.conf"
          "$QT_ROOT_DIR/bin/qt-cmake" -S "$QT_SOURCES/qtremoteobjects" -B build/ci-wasm-qtro -G Ninja \
            -DQT_HOST_PATH="$DECENZA_WASM_HOST_QT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/qtro-wasm-install" \
            -DCMAKE_STAGING_PREFIX="$GITHUB_WORKSPACE/build/qtro-wasm-install" \
            -DQT_BUILD_TESTS=OFF -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_TOOLS_BY_DEFAULT=OFF -DQT_BUILD_DOCS=OFF
          cmake --build build/ci-wasm-qtro --parallel 2
          cmake --install build/ci-wasm-qtro

      - name: Build and verify the shared app bundle
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/ci-wasm -G Ninja \
            -DQT_HOST_PATH="$DECENZA_WASM_HOST_QT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECENZA_QTRO_PREFIX="$GITHUB_WORKSPACE/build/qtro-wasm-install" \
            -DDECENZA_QTMULTIMEDIA_PREFIX="$GITHUB_WORKSPACE/build/qtmultimedia-wasm-install"
          cmake --build build/ci-wasm --parallel 2

      - name: Save the verified bundle for the native package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: matched-wasm-bundle
          path: build/ci-wasm/src/webclient/deployment/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
