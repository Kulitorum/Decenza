name: Android APK Build

on:
  # Manual trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload to GitHub Release'
        required: true
        default: 'false'
        type: boolean
      use_cache:
        description: 'Restore/save the compiler cache (nightly builds pass false for a cold build)'
        required: false
        default: true
        type: boolean
      qml_profiling:
        description: 'Profiling build: QML Profiler port, simpleperf-profileable APK, unstripped library artifact (optimised; never for release)'
        required: false
        default: false
        type: boolean

  # Trigger on version tags (pre-release and release)
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the Qt version. Nothing in this workflow writes
  # into the installed Qt tree any more: Decenza ships stock Qt binaries, so a
  # bump here is just a bump. The patched platform plugin that used to live in
  # android/qt-overrides/ was deleted with the move to 6.11.2, which carries
  # both of its accessibility fixes upstream; the one fix it carried that is
  # still not upstream is kept as source only, in docs/qt-patches/.
  QT_VERSION: '6.12.0'

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # First, before the tag-only version bump: a tag ref releases whatever upload_to_release says.
      - name: Refuse to release a QML-profiling build
        if: ${{ inputs.qml_profiling && (inputs.upload_to_release || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "::error::qml_profiling opens a QML debug port and makes the APK profileable; it must not be uploaded to a release."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'project.*VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # JDK 21, not 17: Qt for Android's own prerequisites page states "Qt for
      # Android development requires JDK 21 or above". 17 built fine, but it is
      # below the floor Qt supports, so a future Qt gradle template is free to
      # stop working on it. AGP 9.2.1 and the Gradle 9.5.1 Qt 6.12's wrapper runs
      # both support 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install minimal host dependencies
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 ninja-build

      # Pin the Python aqtinstall runs on. aqt 3.3.0 (latest, 2025-06-02) extracts
      # Qt's .7z archives via zipfile.is_zipfile, which false-positives on some of
      # them -- it then tries to read a 7z as a zip and dies with
      # `BadZipFile: Bad offset for central directory`. It took out the Qt 6.11.2
      # aarch64 qtdeclarative archive and with it every Linux ARM64 release build.
      # The detection fix is python/cpython#72680, first shipped in Python 3.14, so
      # 3.14 is the MINIMUM that works rather than merely the newest.
      # Set on all six workflows deliberately: which Python aqt gets should be one
      # answer, not six accidental ones. Remove when aqtinstall ships a fix --
      # tracking https://github.com/miurahr/aqtinstall/issues/1042
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          # install-qt-action >= 4.4.0 resolves the version first with
          # `aqt list-qt <host> android --spec X --latest-version` (#335), and aqt
          # lists Qt >= 6.8 Android packages only under all_os -- under `linux` the
          # list stops at 6.7.3 and the step fails before the cache lookup. aqt's
          # --autodesktop still installs the Linux host Qt alongside it.
          host: 'all_os'
          version: ${{ env.QT_VERSION }}
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtquick3d qtshadertools qtgraphs qtconnectivity qtmultimedia qtpositioning qtspeech qtwebsockets qtimageformats qtcanvaspainter'
          install-deps: false  # Skip apt-get of 61 desktop packages — only libegl1/libgl1 needed for qsb shader compiler
          cache: true
          cache-key-prefix: 'qt-android-v1'

      - name: Install Android NDK and compile platform
        run: |
          # The compile platform is stated once, in CMakeLists.txt.
          PLATFORM=$(grep -oP 'QT_ANDROID_COMPILE_SDK_VERSION "\K[^"]+' CMakeLists.txt)
          echo "Compile platform: $PLATFORM"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;$PLATFORM"

          # Try to detect which NDK version Qt expects
          QT_NDK_VERSION=""
          for TOOLCHAIN in "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
                           "$QT_ROOT_DIR/lib/cmake/Qt6/android.toolchain.cmake"; do
            if [ -f "$TOOLCHAIN" ] && [ -z "$QT_NDK_VERSION" ]; then
              QT_NDK_VERSION=$(grep -oP 'ANDROID_NDK_REVISION\s+"?\K[0-9.]+' "$TOOLCHAIN" 2>/dev/null || true)
            fi
          done

          # Fallback: the NDK Qt 6.12 documents (r27c), matching the local dev NDK
          if [ -z "$QT_NDK_VERSION" ]; then
            QT_NDK_VERSION="27.2.12479018"
          fi

          echo "NDK version needed: $QT_NDK_VERSION"

          # Install if not already present
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$QT_NDK_VERSION" ]; then
            echo "Installing NDK $QT_NDK_VERSION..."
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$QT_NDK_VERSION"
          else
            echo "NDK $QT_NDK_VERSION already installed"
          fi

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$QT_NDK_VERSION" >> $GITHUB_ENV

      - name: Set up ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          key: 'android-arm64'
          # A profiling build's global QT_QML_DEBUG define misses every cached object, and
          # saving it would hand the next release build a cache of the wrong objects.
          use_cache: ${{ inputs.qml_profiling && 'false' || inputs.use_cache }}
          # At 500M the cache sat at 99.8% full and evicted at save time
          # (a full build is ~600 objects ≈ one cache-full). 1G fits in the
          # repo cache budget now that prune-caches.yml keeps 1 copy/group.
          max-size: 1G

      # androiddeployqt's "Creating APK" step otherwise downloads the full
      # gradle distribution and re-resolves every dependency on each run
      # (~1m14s of the job). Stable key: an exact hit skips re-saving, so
      # this entry never accumulates timestamped copies. The Qt version
      # pins the gradle/AGP generation — bump the key with Qt upgrades.
      - name: Cache Gradle (androiddeployqt)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-qt6.12.0-${{ hashFiles('android/build.gradle', 'android/settings.gradle') }}
          restore-keys: |
            gradle-android-qt6.12.0-

      - name: Configure ccache for CI
        run: ccache --set-config=compiler_check=content

      - name: Wrap NDK compilers with ccache
        run: |
          # Qt's Android toolchain overrides CMAKE_*_COMPILER_LAUNCHER,
          # so we wrap the actual NDK compiler binaries with ccache instead.
          # We must wrap ALL clang variants: bare clang/clang++, versioned
          # clang-NN, and target-triple prefixed (aarch64-linux-androidNN-clang).
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Find the real clang binary (resolve all symlinks)
          REAL_CLANG="$(readlink -f "$NDK_BIN/clang")"
          echo "Real clang: $REAL_CLANG"

          # Wrap every clang/clang++ variant in the NDK bin directory
          for COMP in "$NDK_BIN"/clang "$NDK_BIN"/clang++ "$NDK_BIN"/clang-[0-9]* "$NDK_BIN"/*-clang "$NDK_BIN"/*-clang++; do
            [ -e "$COMP" ] || continue
            # Skip the real binary itself
            RESOLVED="$(readlink -f "$COMP")"
            if [ "$RESOLVED" = "$REAL_CLANG" ] && [ "$(basename "$COMP")" = "$(basename "$REAL_CLANG")" ]; then
              echo "Skipping real binary: $COMP"
              continue
            fi

            # Determine if this is a C++ variant
            case "$(basename "$COMP")" in
              *clang++*|*c++*) DRIVER_FLAG="--driver-mode=g++ " ;;
              *) DRIVER_FLAG="" ;;
            esac

            rm -f "$COMP"
            printf '#!/bin/sh\nexec ccache "%s" %s"$@"\n' "$REAL_CLANG" "$DRIVER_FLAG" > "$COMP"
            chmod +x "$COMP"
            echo "Wrapped $(basename "$COMP") -> ccache $(basename "$REAL_CLANG") $DRIVER_FLAG"
          done

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK cannot be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/keystore.jks
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          # PCH off: a compile that consumes a PCH is uncacheable, so leaving it
          # on made ccache miss ~88% of this leg's compiles. See PR #1738.
          $QT_ROOT_DIR/bin/qt-cmake .. -G Ninja \
            -DENABLE_TSNET=ON \
            -DDECENZA_ENABLE_PCH=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECENZA_QML_DEBUG=${{ inputs.qml_profiling && 'ON' || 'OFF' }} \
            -DQT_ANDROID_SIGN_APK=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # androiddeployqt signs with apksigner from these (androiddeployqt/main.cpp:469-492)
      # and fails the build if the path or alias is missing.
      - name: Build
        env:
          QT_ANDROID_KEYSTORE_ALIAS: de1-key
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd build
          cmake --build . --config Release --parallel $(nproc)

      - name: Name the signed APK
        id: apk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mapfile -t SIGNED < <(find build -name "*-release-signed.apk" -type f)
          if [ "${#SIGNED[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed release APK, found ${#SIGNED[@]}:"
            find build -name "*.apk" -type f
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -not -name "*.bat" -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${SIGNED[0]}"
          APK="$(dirname "${SIGNED[0]}")/Decenza_${VERSION}.apk"
          cp "${SIGNED[0]}" "$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.qml_profiling && 'Decenza-Android-arm64-qmlprofiling' || 'Decenza-Android-arm64' }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 1
          overwrite: true

      # The link output, before packaging: simpleperf names C++ frames from it
      # (app_profiler.py -lib <dir containing it>).
      - name: Upload unstripped library for simpleperf
        if: ${{ inputs.qml_profiling }}
        uses: actions/upload-artifact@v7
        with:
          name: Decenza-Android-arm64-symbols
          path: build/libDecenza_arm64-v8a.so
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK="${{ steps.apk.outputs.apk_path }}"

          # Find the release tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi

          echo "Uploading to release: $TAG"

          # Check if release exists, create if not
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "Decenza $TAG" \
              --generate-notes
          fi

          # Upload APK
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            gh release upload "$TAG" "$APK" --clobber
          fi

      - name: Inject build number into release notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BUILD_CODE="${{ steps.bump.outputs.build_code }}"

          # Get current release notes
          CURRENT_NOTES=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || echo "")

          # Update existing Build: line, or inject one if not present
          if echo "$CURRENT_NOTES" | grep -qE "^Build:? [0-9]+"; then
            # Replace existing Build: line with new build number
            NEW_NOTES=$(echo "$CURRENT_NOTES" | sed -E "s/^Build:? [0-9]+/Build: $BUILD_CODE/")
            gh release edit "$TAG" --notes "$NEW_NOTES"
            echo "Updated Build: $BUILD_CODE in release notes"
          elif [ -z "$CURRENT_NOTES" ]; then
            gh release edit "$TAG" --notes "Build: $BUILD_CODE"
            echo "Injected Build: $BUILD_CODE into release notes"
          else
            # Insert Build: line after first heading or at the top
            NEW_NOTES=$(echo "$CURRENT_NOTES" | sed "0,/^## /{s/^## \(.*\)/## \1\n\nBuild: $BUILD_CODE/}")
            # If no heading was found (sed didn't change anything), prepend
            if [ "$NEW_NOTES" = "$CURRENT_NOTES" ]; then
              NEW_NOTES="Build: $BUILD_CODE

          $CURRENT_NOTES"
            fi
            gh release edit "$TAG" --notes "$NEW_NOTES"
            echo "Injected Build: $BUILD_CODE into release notes"
          fi

      - name: Commit version code back to main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          BUILD_CODE="${{ steps.bump.outputs.build_code }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Preserve .ccache before stash (stash --include-untracked would wipe it)
          [ -d .ccache ] && mv .ccache /tmp/.ccache-preserve
          git stash --include-untracked
          git checkout origin/main
          [ -d /tmp/.ccache-preserve ] && mv /tmp/.ccache-preserve .ccache
          echo "$BUILD_CODE" > versioncode.txt
          git add versioncode.txt
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No version code changes to commit"
          else
            git commit -m "ci: bump version code to $BUILD_CODE [skip ci]"
            # Retry push with rebase in case main advanced during the build
            PUSH_OK=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Committed version code $BUILD_CODE back to main"
                PUSH_OK=true
                break
              else
                echo "Push failed (attempt $attempt/3), rebasing..."
                git pull --rebase origin main
              fi
            done
            if [ "$PUSH_OK" != "true" ]; then
              echo "::warning::Could not push version code $BUILD_CODE back to main after 3 attempts"
            fi
          fi

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f $RUNNER_TEMP/keystore.jks || true
