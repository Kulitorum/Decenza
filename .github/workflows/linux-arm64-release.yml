name: Linux ARM64 AppImage Build

on:
  # Manual trigger from GitHub UI or API
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload to GitHub Release'
        required: true
        default: 'false'
        type: boolean
      use_cache:
        description: 'Restore/save the compiler cache (nightly builds pass false for a cold build)'
        required: false
        default: true
        type: boolean

  # Trigger on version tags (pre-release and release)
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libpulse0 \
            libspeechd2 \
            fuse \
            libfuse2

      # Pin the Python aqtinstall runs on. aqt 3.3.0 (latest, 2025-06-02) extracts
      # Qt's .7z archives via zipfile.is_zipfile, which false-positives on some of
      # them -- it then tries to read a 7z as a zip and dies with
      # `BadZipFile: Bad offset for central directory`. It took out the Qt 6.11.2
      # aarch64 qtdeclarative archive and with it every Linux ARM64 release build.
      # The detection fix is python/cpython#72680, first shipped in Python 3.14, so
      # 3.14 is the MINIMUM that works rather than merely the newest.
      # Set on all six workflows deliberately: which Python aqt gets should be one
      # answer, not six accidental ones. Remove when aqtinstall ships a fix --
      # tracking https://github.com/miurahr/aqtinstall/issues/1042
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          version: '6.11.2'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          modules: 'qtquick3d qtshadertools qtgraphs qtconnectivity qtmultimedia qtpositioning qtspeech qtwebsockets qtserialport qtimageformats qtcanvaspainter'
          cache: true
          cache-key-prefix: 'qt-linux-arm64-v1'

      - name: Set up ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          key: 'linux-arm64'
          use_cache: ${{ inputs.use_cache }}

      - name: Configure ccache for CI
        run: ccache --set-config=compiler_check=content

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          # PCH off: a compile that consumes a PCH is uncacheable, so leaving it
          # on made ccache miss ~86% of this leg's compiles. See PR #1738.
          $QT_ROOT_DIR/bin/qt-cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECENZA_ENABLE_PCH=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build
          ninja -j$(nproc)

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "project(Decenza VERSION" CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/Decenza AppDir/usr/bin/
          cp decenza.desktop AppDir/usr/share/applications/
          cp decenza.png AppDir/usr/share/icons/hicolor/256x256/apps/

      - name: Install GStreamer
        run: |
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Remove problematic Qt plugins
        run: |
          # Remove plugins with external dependencies not available in AppImage
          rm -f $QT_ROOT_DIR/plugins/imageformats/libqtiff.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlibase.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlpsql.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlmysql.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqloci.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlodbc.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlmimer.so
          rm -f $QT_ROOT_DIR/plugins/position/libqtposition_nmea.so
          # Flite TTS plugin has missing libflite.so.1 dependency (we use speechd)
          rm -f $QT_ROOT_DIR/plugins/texttospeech/libqtexttospeech_flite.so

      - name: Create AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
        run: |
          ./linuxdeploy-aarch64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Rename AppImage
        run: |
          mv Decenza-aarch64.AppImage Decenza_${{ steps.version.outputs.version }}-aarch64.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Decenza-Linux-aarch64
          path: Decenza_${{ steps.version.outputs.version }}-aarch64.AppImage
          retention-days: 1
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the tag name (either from push or extract version)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${{ steps.version.outputs.version }}"
          fi

          echo "Uploading to release: $TAG_NAME"

          # Check if release exists, create if not
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Creating release $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "Decenza $TAG_NAME" \
              --generate-notes
          fi

          # Upload the AppImage
          gh release upload "$TAG_NAME" \
            "Decenza_${{ steps.version.outputs.version }}-aarch64.AppImage" \
            --clobber
