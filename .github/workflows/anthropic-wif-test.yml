          \  turns: Number.isSafeInteger(result?.num_turns) ? result.num_turns : null,\n  cost_usd: Number.isFinite(result?.total_cost_usd)\
          \ ? result.total_cost_usd : null};\ncore.info('Safe diagnostic: '+JSON.stringify(signals));\nawait core.summary.addHeading('Official\
          \ Claude action federation probe')\n  .addRaw('Result: '+reason+'. Tokens, model response and raw errors were not\
          \ logged.\\n').write();\nif (reason !== 'success') core.setFailed('Official action probe failed: '+reason+'.');\n"
  official_action_clean_env:
    if: ${{ github.actor_id == '1629894' && inputs.test_actions }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      NODE_VERSION: 26.11.1
    steps:
    - name: Use current Node runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26.11.1
        package-manager-cache: false
    - name: Check out trusted default branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        persist-credentials: false
    - name: Install current Claude CLI
      id: cli
      run: |
        curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
        bash "$RUNNER_TEMP/install-claude.sh" 2.1.294
        printf 'path=%s/.local/bin/claude\n' "$HOME" >> "$GITHUB_OUTPUT"
    - name: Remove empty credential overrides at CLI launch
      id: launch
      run: |
        cat > "$RUNNER_TEMP/claude-wif-launch" <<'SH'
        #!/bin/sh
        # Refuse unexpected static credentials; only remove empty variables.
        if [ -n "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_AUTH_TOKEN:-}" ]; then
          echo 'Unexpected static credential configured; federation diagnostic stopped.' >&2
          exit 1
        fi
        exec env -u ANTHROPIC_API_KEY -u CLAUDE_CODE_OAUTH_TOKEN -u ANTHROPIC_AUTH_TOKEN "$HOME/.local/bin/claude" "$@"
        SH
        chmod 700 "$RUNNER_TEMP/claude-wif-launch"
        printf 'path=%s/claude-wif-launch\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
