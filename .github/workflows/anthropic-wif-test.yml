          \ ? 'credit_error'\n  : /jti|federat|invalid.?grant/i.test(value) ? 'federation_error'\n  : /401|403|authenticat|permission/i.test(value)\
          \ ? 'authentication_error'\n  : /spend.?limit|spending.?limit/i.test(value) ? 'spending_limit'\n  : /429|rate.?limit/i.test(value)\
          \ ? 'rate_limit' : 'other_failure';\nconst signals = {reason, exact_credit_preflight: /^Credit balance is too low(?:\\\
          s*[\xB7\u2014-].*)?$/i.test(value.trim()),\n  contains_http_error: /API Error:|HTTP [45]\\d\\d/i.test(value),\n\
          \  turns: Number.isSafeInteger(result?.num_turns) ? result.num_turns : null,\n  cost_usd: Number.isFinite(result?.total_cost_usd)\
          \ ? result.total_cost_usd : null};\ncore.info('Safe diagnostic: '+JSON.stringify(signals));\nawait core.summary.addHeading('Official\
          \ Claude action federation probe')\n  .addRaw('Result: '+reason+'. Tokens, model response and raw errors were not\
          \ logged.\\n').write();\nif (reason !== 'success') core.setFailed('Official action probe failed: '+reason+'.');\n"
  direct_cli:
    if: ${{ github.actor_id == '1629894' && inputs.test_direct_cli }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      NODE_VERSION: 26.11.1
    steps:
    - name: Use current Node runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26.11.1
        package-manager-cache: false
    - name: Check out trusted default branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        persist-credentials: false
    - name: Install current Claude CLI
      id: cli
      run: |
        curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
        bash "$RUNNER_TEMP/install-claude.sh" 2.1.294
        printf 'path=%s/.local/bin/claude\n' "$HOME" >> "$GITHUB_OUTPUT"
    - name: Exchange existing federated identity for runtime bearer token
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: |
          const identityToken = await core.getIDToken('https://api.anthropic.com');
          core.setSecret(identityToken);
          let response;
          try {
            response = await fetch('https://api.anthropic.com/v1/oauth/token', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: identityToken,
                federation_rule_id: 'fdrl_01845VJkqDXmxfEeoz22VNyg',
                organization_id: 'e3971c6d-a39b-46fc-a5e9-d152d5f5d476',
                service_account_id: 'svac_01Rjzffi5Zn9hAG3NSPrboZE',
                workspace_id: 'wrkspc_01CfPYtm6bgzXkKPucdyGATe'
              }),
              signal: AbortSignal.timeout(30000)
            });
          } catch {
            core.setFailed('Anthropic token exchange could not be reached. No response body or token was logged.');
            return;
          }
          if (!response.ok) {
            core.setFailed(`Anthropic token exchange failed (HTTP ${response.status}). Check Claude Console authentication history for this rule.`);
            return;
          }
          let result;
          try {
            result = await response.json();
          } catch {
            core.setFailed('Anthropic returned an invalid exchange response. The response body was not logged.');
            return;
          }
          if (typeof result.access_token === 'string') core.setSecret(result.access_token);
          if (!result.access_token || result.token_type?.toLowerCase() !== 'bearer' ||
              !Number.isFinite(result.expires_in) || result.expires_in <= 0) {
            core.setFailed('Anthropic exchange response did not contain a valid expiring bearer token. No response body was logged.');
            return;
          }
          core.exportVariable('ANTHROPIC_AUTH_TOKEN', result.access_token);
          core.info('Short-lived bearer credential exchanged from the configured federation rule; value is masked.');
    - name: Launch current CLI with federated bearer credential
      id: launch
      run: |
        cat > "$RUNNER_TEMP/claude-wif-bearer-launch" <<'SH'
        #!/bin/sh
        if [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
          echo 'Expected federated bearer credential missing or conflicting credential present.' >&2
          exit 1
        fi
        exec env -u ANTHROPIC_API_KEY -u CLAUDE_CODE_OAUTH_TOKEN "$HOME/.local/bin/claude" "$@"
        SH
        chmod 700 "$RUNNER_TEMP/claude-wif-bearer-launch"
        printf 'path=%s/claude-wif-bearer-launch\n' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
    - name: Compare direct current CLI without action SDK
      env:
        LAUNCHER: ${{ steps.launch.outputs.path }}
      run: |
        set +e
        "$LAUNCHER" --bare -p 'Reply exactly OK. Use no tools.' --model claude-sonnet-5-5 \
          --tools '' --max-turns 2 --max-budget-usd 0.10 --output-format json \
          > "$RUNNER_TEMP/direct-cli-result.json" 2> "$RUNNER_TEMP/direct-cli-stderr.txt"
        status=$?
        python3 - <<'PY'
        import json, os, pathlib
        file=pathlib.Path(os.environ['RUNNER_TEMP'])/'direct-cli-result.json'
        try: result=json.loads(file.read_text())
        except Exception: raise SystemExit('Direct CLI returned no parseable result. Private output was not logged.')
        value=result.get('result','')
        reason='success' if result.get('is_error') is False and value.strip()=='OK' else 'credit_error' if 'credit balance' in value.lower() else 'other_failure'
        print('Safe direct CLI diagnostic: '+json.dumps({'reason':reason,'turns':result.get('num_turns'),'cost_usd':result.get('total_cost_usd')}))
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write('Direct CLI with existing federation identity: '+reason+'. Raw response and tokens remain private.\n')
        if reason!='success': raise SystemExit('Direct CLI probe failed: '+reason)
        PY
        parse_status=$?
        if [ "$status" -ne 0 ] || [ "$parse_status" -ne 0 ]; then exit 1; fi
  official_action_api_key:
    if: ${{ github.actor_id == '1629894' && inputs.test_api_key_action }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      NODE_VERSION: 26.11.1
    steps:
    - name: Use current Node runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26.11.1
        package-manager-cache: false
    - name: Check out trusted default branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        persist-credentials: false
    - name: Install current Claude CLI
      id: cli
      run: |
        curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
        bash "$RUNNER_TEMP/install-claude.sh" 2.1.294
        printf 'path=%s/.local/bin/claude\n' "$HOME" >> "$GITHUB_OUTPUT"
    - name: API key probe
      id: claude
      uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515
      with:
        anthropic_api_key: ${{ secrets.JEFF_ANTHROPIC_API_KEY }}
        show_full_output: false
        prompt: This is an authentication diagnostic. Reply exactly OK. Use no tools.
        claude_args: --model claude-sonnet-5-5 --max-turns 2 --max-budget-usd 0.10 --tools "" --setting-sources user --strict-mcp-config
        github_token: ${{ github.token }}
        display_report: false
        classify_inline_comments: false
        include_fix_links: false
        path_to_claude_code_executable: ${{ steps.cli.outputs.path }}
    - name: Report safe action result
      if: ${{ always() }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      with:
        script: "const fs = require('fs');\nconst file = process.env.EXECUTION_FILE || process.env.RUNNER_TEMP+'/claude-execution-output.json';\n\
          if (!fs.existsSync(file)) {core.setFailed('No private execution result was produced.'); return;}\nlet messages;\n\
          try {messages=JSON.parse(fs.readFileSync(file,'utf8'));} catch {core.setFailed('Invalid private execution result.');\
          \ return;}\nconst result = Array.isArray(messages) ? messages.findLast(value => value.type === 'result') : null;\n\
          const value = typeof result?.result === 'string' ? result.result : '';\nconst reason = !result ? 'missing_result'\
          \ : !result.is_error && value.trim() === 'OK' ? 'success'\n  : /credit balance|insufficient.?credit/i.test(value)\
          \ ? 'credit_error'\n  : /jti|federat|invalid.?grant/i.test(value) ? 'federation_error'\n  : /401|403|authenticat|permission/i.test(value)\
          \ ? 'authentication_error'\n  : /spend.?limit|spending.?limit/i.test(value) ? 'spending_limit'\n  : /429|rate.?limit/i.test(value)\
          \ ? 'rate_limit' : 'other_failure';\nconst signals = {reason, exact_credit_preflight: /^Credit balance is too low(?:\\\
          s*[\xB7\u2014-].*)?$/i.test(value.trim()),\n  contains_http_error: /API Error:|HTTP [45]\\d\\d/i.test(value),\n\
          \  turns: Number.isSafeInteger(result?.num_turns) ? result.num_turns : null,\n  cost_usd: Number.isFinite(result?.total_cost_usd)\
          \ ? result.total_cost_usd : null};\ncore.info('Safe diagnostic: '+JSON.stringify(signals));\nawait core.summary.addHeading('Official\
          \ Claude action federation probe')\n  .addRaw('Result: '+reason+'. Tokens, model response and raw errors were not\
          \ logged.\\n').write();\nif (reason !== 'success') core.setFailed('Official action probe failed: '+reason+'.');\n"
'on':
  push:
    branches:
    - codex/claude-workload-identity
    paths:
    - .github/workflows/anthropic-wif-test.yml
  workflow_dispatch:
    inputs:
      test_inference:
        description: Also make one tiny paid API request to diagnose model/account limits
        required: false
        default: false
        type: boolean
      test_actions:
        description: Compare tiny native WIF calls through both official Claude actions (up to USD 0.10 each)
        required: false
        default: false
        type: boolean
      test_bearer_action:
        description: Test the official action with a short-lived token exchanged from the same WIF rule (USD 0.10 cap)
        required: false
        default: false
        type: boolean
      test_direct_cli:
        description: Isolate the current CLI from the action SDK using the same federated runtime token (USD 0.10 cap)
        required: false
        default: false
        type: boolean
      test_api_key_action:
        description: Run the same official-action probe with the JEFF_ANTHROPIC_API_KEY secret instead of WIF (USD 0.10 cap)
        required: false
        default: false
        type: boolean
