      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  build-macos:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.platforms), 'macos') }}
    concurrency:
      group: native-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'project.*VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Pin the Python aqtinstall runs on. aqt 3.3.0 (latest, 2025-06-02) extracts
      # Qt's .7z archives via zipfile.is_zipfile, which false-positives on some of
      # them -- it then tries to read a 7z as a zip and dies with
      # `BadZipFile: Bad offset for central directory`. It took out the Qt 6.11.2
      # aarch64 qtdeclarative archive and with it every Linux ARM64 release build.
      # The detection fix is python/cpython#72680, first shipped in Python 3.14, so
      # 3.14 is the MINIMUM that works rather than merely the newest.
      # Set on all six workflows deliberately: which Python aqt gets should be one
      # answer, not six accidental ones. Remove when aqtinstall ships a fix --
      # tracking https://github.com/miurahr/aqtinstall/issues/1042
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Select Qt modules (app desktop macos)
        id: qt_modules
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh app desktop macos)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          version: '6.12.0'
          target: 'desktop'
          arch: 'clang_64'
          modules: ${{ steps.qt_modules.outputs.list }}
          # No caches on this leg (Qt, ccache, OpenSSL): nobody waits on the macOS
          # build, and its ~2.6 GB was a quarter of the repo's 10 GB cache store.
          cache: false

      - name: Set up Xcode (pin + deployment-target shims)
        uses: ./.github/actions/setup-xcode
        with:
          xcode-version: '26.4.1'

      - name: Install Apple Developer ID certificate
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/developer_id_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode from base64
          echo -n "$P12_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Verify certificate
          echo "Installed certificates:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Resolve latest OpenSSL 3.x
        id: openssl-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh api repos/openssl/openssl/releases --jq '[.[] | select(.tag_name | startswith("openssl-3.")) | .tag_name][0]' | sed 's/openssl-//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using OpenSSL $VERSION"

      - name: Build universal OpenSSL
        run: |
          OPENSSL_VERSION="${{ steps.openssl-version.outputs.version }}"
          OPENSSL_URL="https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          INSTALL_PREFIX="${RUNNER_TEMP}/openssl-universal"

          cd $RUNNER_TEMP
          curl -L "$OPENSSL_URL" | tar xz
          cd "openssl-${OPENSSL_VERSION}"

          # Build arm64
          ./Configure darwin64-arm64-cc no-shared no-tests \
            --prefix="${INSTALL_PREFIX}/arm64" \
            -mmacosx-version-min=12.0
          make -j$(sysctl -n hw.ncpu)
          make install_sw
          make clean

          # Build x86_64
          ./Configure darwin64-x86_64-cc no-shared no-tests \
            --prefix="${INSTALL_PREFIX}/x86_64" \
            -mmacosx-version-min=12.0
          make -j$(sysctl -n hw.ncpu)
          make install_sw

          # Create universal libs
          mkdir -p "${INSTALL_PREFIX}/lib"
          cp -R "${INSTALL_PREFIX}/arm64/include" "${INSTALL_PREFIX}/"
          for lib in libssl.a libcrypto.a; do
            lipo -create \
              "${INSTALL_PREFIX}/arm64/lib/${lib}" \
              "${INSTALL_PREFIX}/x86_64/lib/${lib}" \
              -output "${INSTALL_PREFIX}/lib/${lib}"
          done
          echo "Universal OpenSSL installed at ${INSTALL_PREFIX}"

      - name: Configure CMake
        run: |
          OPENSSL_PREFIX="${RUNNER_TEMP}/openssl-universal"
          mkdir -p build/macos
          cd build/macos
          # PCH on (the CMake default here): with no compiler cache there is no
          # cache hit for it to cost, so it is pure speed on a cold build.
          # Ninja keeps unchanged QML outputs across the late bundle reconfigure.
          # Preserve the existing release bundle path used by signing/packaging.
          cmake --version
          ninja --version
          $QT_ROOT_DIR/bin/qt-cmake ../.. -G Ninja \
            -DDECENZA_WEB_BUNDLE_MODE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build/macos/Release" \
            -DENABLE_TSNET=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \
            -DOPENSSL_INCLUDE_DIR="${OPENSSL_PREFIX}/include" \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_PREFIX}/lib/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="${OPENSSL_PREFIX}/lib/libssl.a"

      - name: Compile native app while Wasm builds
        run: |
          cd build/macos
          cmake --build . --config Release --target Decenza --parallel

      - name: Add the verified Wasm bundle before packaging
        uses: ./.github/actions/finish-webclient
        with:
          build-directory: build/macos

      - name: Verify universal embedded resources
        run: |
          cmake --build build/macos --config Release --target decenza-verify-webclient --parallel
          lipo build/macos/Release/Decenza.app/Contents/MacOS/Decenza -verify_arch x86_64 arm64
          lipo build/macos/Release/decenza-verify-webclient -verify_arch x86_64 arm64
          arch -arm64 build/macos/Release/decenza-verify-webclient "$GITHUB_WORKSPACE/.ci/webclient"
          arch -x86_64 build/macos/Release/decenza-verify-webclient "$GITHUB_WORKSPACE/.ci/webclient"

      - name: Bundle Qt frameworks
        run: |
          APP_PATH="build/macos/Release/Decenza.app"
          echo "Running macdeployqt on: $APP_PATH"

          # macdeployqt bundles Qt frameworks and fixes library paths
          $QT_ROOT_DIR/bin/macdeployqt "$APP_PATH" -qmldir=qml -verbose=2

          echo "Bundled frameworks:"
          ls -la "$APP_PATH/Contents/Frameworks/" | head -20

      - name: Sign the application
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP_PATH="build/macos/Release/Decenza.app"

          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Sign all nested components first, then the app itself
          # --options runtime enables hardened runtime (required for notarization)
          # --deep signs nested code
          # --force replaces any existing signatures
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: Michael Holm (HKHN2RK2P4)" \
            "$APP_PATH"

          # Verify signature
          echo "Verifying signature..."
          codesign -dvv "$APP_PATH"
          codesign --verify --strict "$APP_PATH"
          echo "Signature verified successfully"

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_NAME="Decenza_v${VERSION}_macos.dmg"

          # Find the built app (named Decenza.app)
          APP_PATH="build/macos/Release/Decenza.app"
          echo "Looking for app at: $APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Could not find $APP_PATH"
            find build/macos -name "*.app" -type d
            exit 1
          fi

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_PATH" "dmg_contents/Decenza.app"

          # Create Applications symlink
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "Decenza" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "Created: $DMG_NAME"
          ls -la "$DMG_NAME"

      - name: Sign the DMG
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_NAME="Decenza_v${VERSION}_macos.dmg"

          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Sign the DMG
          codesign --force --sign "Developer ID Application: Michael Holm (HKHN2RK2P4)" "$DMG_NAME"

          echo "DMG signed successfully"

      - name: Notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_NAME="Decenza_v${VERSION}_macos.dmg"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_APP_PASSWORD" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_NAME"

          echo "Notarization complete!"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Decenza-macOS
          path: Decenza_v*.dmg
          retention-days: 1
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DMG_NAME="Decenza_v${VERSION}_macos.dmg"

          # Find the release (by tag or latest)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi

          echo "Uploading to release: $TAG"
          gh release upload "$TAG" "$DMG_NAME" --clobber

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  build-windows:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.platforms), 'windows') }}
    concurrency:
      group: native-windows-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest

    steps:
      # The Wasm artifact hashes LF source bytes on Linux.
      - name: Keep source bytes identical across platforms
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        shell: bash
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'project.*VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Pin the Python aqtinstall runs on. aqt 3.3.0 (latest, 2025-06-02) extracts
      # Qt's .7z archives via zipfile.is_zipfile, which false-positives on some of
      # them -- it then tries to read a 7z as a zip and dies with
      # `BadZipFile: Bad offset for central directory`. It took out the Qt 6.11.2
      # aarch64 qtdeclarative archive and with it every Linux ARM64 release build.
      # The detection fix is python/cpython#72680, first shipped in Python 3.14, so
      # 3.14 is the MINIMUM that works rather than merely the newest.
      # Set on all six workflows deliberately: which Python aqt gets should be one
      # answer, not six accidental ones. Remove when aqtinstall ships a fix --
      # tracking https://github.com/miurahr/aqtinstall/issues/1042
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Select Qt modules (app desktop)
        id: qt_modules
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh app desktop)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          version: '6.12.0'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: ${{ steps.qt_modules.outputs.list }}
          tools: 'tools_ninja'
          cache: true
          cache-key-prefix: 'qt-windows-v3-aqt-master'
          # Qt 6.11.0 reorganised the Windows online repo layout: the
          # `qt6_6110/qt6_6110/Updates.xml` path was replaced by per-arch
          # subdirectories (`qt6_6110_msvc2022_64`, `qt6_6110_mingw`, ...).
          # aqtinstall 3.3.0 (the latest release, pinned by install-qt-action)
          # only knows the old layout and fails with "Failed to locate XML
          # data for Qt version '6.11.0'". The fix landed on master via
          # miurahr/aqtinstall#1000 (merged 2026-03-24) but no release ships
          # it yet — pin to that merge commit until aqtinstall 3.4 lands.
          # Other platforms still use the old single-dir layout in 6.11.0
          # and work with stock 3.3.0; this override is Windows-only.
          # TODO(qt-6.11): when aqtinstall >= 3.4.0 ships
          # (https://pypi.org/project/aqtinstall/), drop this `aqtsource` line
          # and let install-qt-action use its default. If the cycle repeats
          # on a future Qt minor (3-month upstream-fix-to-release gap was the
          # failure mode), evaluate `use-official: true` instead.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Find Qt bundled Ninja and add to PATH
        shell: powershell
        run: |
          $ninja = Get-ChildItem "$env:QT_ROOT_DIR\..\..\Tools" -Recurse -Filter "ninja.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ninja) { Write-Error "Ninja not found in Qt Tools directory"; exit 1 }
          Write-Host "Found Ninja at: $($ninja.FullName)"
          Add-Content $env:GITHUB_PATH $ninja.DirectoryName

      - name: Set up sccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          variant: sccache
          key: 'sccache-windows-x64-qt6.12.0-vs2026'
          use_cache: ${{ inputs.use_cache }}

      - name: Locate OpenSSL 3
        id: openssl
        shell: powershell
        run: |
          # Qt's Windows TLS plugin loads libssl-<major>-x64.dll for the OpenSSL major
          # it was built against (qsslsocket_openssl_symbols.cpp:670-716). That was 3
          # for 6.11.2; confirm it for 6.12.0 (upgrade-qt-6-12 task 2.7) — 6.12 can
          # build against OpenSSL 4, which would need libssl-4-x64.dll here instead. We previously installed
          # OpenSSL via `choco install openssl`, but:
          #   - Unpinned, Chocolatey will ship OpenSSL 4.x which has an incompatible ABI.
          #   - The chocolatey package downloads from slproweb.com/download/Win64OpenSSL-<ver>.exe,
          #     and Shining Light Productions removes old 3.x installers when new ones
          #     ship — so even `--version=3.5.4` breaks with a 404 from their CDN.
          # GitHub's windows-latest runner image already pre-installs OpenSSL 3.x at
          # C:\Program Files\OpenSSL\bin. Use that and explicitly verify the major
          # version via openssl.exe to catch any future runner-image bump to 4.x.

          $candidates = @(
            "C:\Program Files\OpenSSL-Win64\bin",
            "C:\Program Files\OpenSSL\bin",
            "C:\OpenSSL-Win64\bin"
          )

          $opensslBin = $null
          foreach ($dir in $candidates) {
            if ((Test-Path "$dir\libssl-3-x64.dll") -and
                (Test-Path "$dir\libcrypto-3-x64.dll") -and
                (Test-Path "$dir\openssl.exe")) {
              $version = & "$dir\openssl.exe" version 2>$null
              if ($version -match "^OpenSSL 3\.") {
                Write-Host "$version at $dir"
                $opensslBin = $dir
                break
              }
              Write-Host "Skipping $dir (version: $version)"
            }
          }

          if (-not $opensslBin) {
            Write-Error "OpenSSL 3.x runtime not found in any canonical install path on this runner. The GitHub windows-latest image may have removed its bundled OpenSSL, or bumped it to 4.x (which this Qt build cannot load)."
            exit 1
          }

          echo "dir=$opensslBin" >> $env:GITHUB_OUTPUT

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DDECENZA_WEB_BUNDLE_MODE=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Compile native app while Wasm builds
        run: |
          cd build
          cmake --build . --parallel

      - name: Add the verified Wasm bundle before packaging
        uses: ./.github/actions/finish-webclient
        with:
          build-directory: build

      - name: Download VC++ Redistributable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path vcredist
          Invoke-WebRequest -Uri "https://aka.ms/vs/18/release/vc_redist.x64.exe" -OutFile "vcredist\vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Create Inno Setup config
        shell: powershell
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $BUILD_NUM = (Get-Content "versioncode.txt").Trim()
          $WORKSPACE = $env:GITHUB_WORKSPACE
          $QT_DIR = $env:QT_ROOT_DIR

          # Create version.iss
          @"
          #define BuildNumber "$BUILD_NUM"
          #define VersionNumber "$VERSION"
          #define TargetName "Decenza"
          #define TargetArch "x64"
          #define TargetProduct "Decenza"
          #define TargetCompany "Decenza"
          "@ | Out-File -FilePath "installer\version.iss" -Encoding ASCII

          # Create setupvars.iss for CI
          @"
          ; CI-generated paths
          #define SourceDir "$WORKSPACE"
          #define AppBuildDir "$WORKSPACE\build"
          #define AppDeployDir "$WORKSPACE\installer\deploy"
          #define QtDir "$QT_DIR"
          #define VcRedistDir "$WORKSPACE\vcredist"
          #define VcRedistFile "vc_redist.x64.exe"
          #define OpenSslDir "${{ steps.openssl.outputs.dir }}"
          "@ | Out-File -FilePath "installer\setupvars.iss" -Encoding ASCII

          Write-Host "=== version.iss ==="
          Get-Content installer\version.iss
          Write-Host "=== setupvars.iss ==="
          Get-Content installer\setupvars.iss

      - name: Build Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"installer\Output" installer\setup.iss

      - name: List output
        shell: bash
        run: |
          echo "=== Installer output ==="
          ls -la installer/Output/

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Decenza-Windows-Installer
          path: installer/Output/*.exe
          retention-days: 1
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          INSTALLER="installer/Output/Decenza_v${VERSION}_winx64_installer.exe"

          # Find the release (by tag or latest)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi

          echo "Uploading to release: $TAG"
          gh release upload "$TAG" "$INSTALLER" --clobber

  build-linux:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.platforms), 'linux') }}
    concurrency:
      group: native-linux-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Install dependencies
        uses: ./.github/actions/install-linux-packages

      # Pin the Python aqtinstall runs on. aqt 3.3.0 (latest, 2025-06-02) extracts
      # Qt's .7z archives via zipfile.is_zipfile, which false-positives on some of
      # them -- it then tries to read a 7z as a zip and dies with
      # `BadZipFile: Bad offset for central directory`. It took out the Qt 6.11.2
      # aarch64 qtdeclarative archive and with it every Linux ARM64 release build.
      # The detection fix is python/cpython#72680, first shipped in Python 3.14, so
      # 3.14 is the MINIMUM that works rather than merely the newest.
      # Set on all six workflows deliberately: which Python aqt gets should be one
      # answer, not six accidental ones. Remove when aqtinstall ships a fix --
      # tracking https://github.com/miurahr/aqtinstall/issues/1042
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Select Qt modules (app desktop)
        id: qt_modules
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh app desktop)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          version: '6.12.0'
          target: 'desktop'
          arch: 'linux_gcc_64'
          install-deps: false  # install-linux-packages installs Qt's dependencies too.
          modules: ${{ steps.qt_modules.outputs.list }}
          cache: true
          cache-key-prefix: 'qt-linux-v4'

      - name: Set up ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          key: 'linux-x86_64'
          use_cache: ${{ inputs.use_cache }}

      - name: Configure ccache for CI
        run: ccache --set-config=compiler_check=content

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          # PCH off: a compile that consumes a PCH is uncacheable, so leaving it
          # on made ccache miss ~90% of this leg's compiles. See PR #1738.
          $QT_ROOT_DIR/bin/qt-cmake .. -G Ninja \
            -DDECENZA_WEB_BUNDLE_MODE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECENZA_ENABLE_PCH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=ON

      - name: Compile native app while Wasm builds
        run: |
          cd build
          ninja -j$(nproc)

      - name: Add the verified Wasm bundle before packaging
        uses: ./.github/actions/finish-webclient
        with:
          build-directory: build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build
          set -o pipefail
          # -j parallelises; --repeat until-pass:3 absorbs the rare timing flake
          # in the two clock-cadence tests (tst_settling, tst_decentscalewifi)
          # under heavy CPU contention. A real failure still fails all 3 attempts.
          ctest --output-on-failure -j$(nproc) --repeat until-pass:3 2>&1 | tee ctest.log

      # "A real failure still fails all 3 attempts" is true and was not enough.
      # tst_mcptools_profiles and tst_mcptools_write failed the FIRST attempt of
      # every clean run — a missing profiles QRC, entirely deterministic — and
      # passed the second because the first attempt had left the file on disk.
      # The retry turned a reproducible bug into a green tick, and it stayed
      # that way until someone read a log line-by-line for an unrelated reason.
      #
      # This does not fail the job: a genuine flake is still worth retrying, and
      # making retries fatal would just delete the mechanism. It makes them
      # VISIBLE, so "passed on retry" is a thing someone can notice.
      - name: Report tests that only passed on retry
        if: always()
        run: |
          cd build
          [ -f ctest.log ] || exit 0
          # A retried test prints "***Failed" and later "Passed" for the same
          # test number; collect the numbers that show both.
          retried=$(grep -oE "Test +#[0-9]+: +[a-zA-Z_0-9]+ +\.+\*\*\*Failed" ctest.log \
                    | grep -oE "#[0-9]+: +[a-zA-Z_0-9]+" | sort -u || true)
          if [ -n "$retried" ]; then
            {
              echo "### Tests that failed at least one attempt"
              echo ""
              echo "These passed only because of \`--repeat until-pass:3\`. A test that"
              echo "fails deterministically on attempt 1 is a bug, not a flake — check"
              echo "before assuming timing."
              echo '```'
              echo "$retried"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Some tests passed only on retry; see the job summary."
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "project(Decenza VERSION" CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/Decenza AppDir/usr/bin/
          cp decenza.desktop AppDir/usr/share/applications/
          cp decenza.png AppDir/usr/share/icons/hicolor/256x256/apps/

      - name: Remove problematic Qt plugins
        run: |
          # Remove plugins with external dependencies not available in AppImage
          # Must be done after CMake but before linuxdeploy
          rm -f $QT_ROOT_DIR/plugins/imageformats/libqtiff.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlibase.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlpsql.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlmysql.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqloci.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlodbc.so
          rm -f $QT_ROOT_DIR/plugins/sqldrivers/libqsqlmimer.so
          # Position plugin needs SerialPort which isn't installed
          rm -f $QT_ROOT_DIR/plugins/position/libqtposition_nmea.so

      - name: Create AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Rename AppImage
        run: |
          mv Decenza-x86_64.AppImage Decenza_${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Decenza-Linux-x86_64
          path: Decenza_${{ steps.version.outputs.version }}-x86_64.AppImage
          retention-days: 1
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the tag name (either from push or extract version)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${{ steps.version.outputs.version }}"
          fi

          echo "Uploading to release: $TAG_NAME"

          # Check if release exists, create if not
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Creating release $TAG_NAME"
            gh release create "$TAG_NAME" \
              --title "Decenza $TAG_NAME" \
              --generate-notes
          fi

          # Upload the AppImage
          gh release upload "$TAG_NAME" \
            "Decenza_${{ steps.version.outputs.version }}-x86_64.AppImage" \
            --clobber

