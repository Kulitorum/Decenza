name: Release all platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'all, wasm only, or a list: android ios macos windows linux linux-arm64'
        type: string
        default: all
      upload_to_release:
        description: 'Publish packages (includes App Store Connect for iOS)'
        type: boolean
        default: false
      use_cache:
        description: 'Use compiler caches (off: every build is cold and nothing is saved)'
        type: boolean
        default: true
      qml_profiling:
        description: 'Android QML profiling build; never publish'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.platforms || 'all' }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.12.0'

jobs:
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - name: Validate selected platforms
        id: select
        env:
          REQUESTED: ${{ inputs.platforms || 'all' }}
          PROFILING: ${{ inputs.qml_profiling }}
          PUBLISHING: ${{ inputs.upload_to_release || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          native = ['android', 'ios', 'macos', 'windows', 'linux', 'linux-arm64']
          allowed = native + ['wasm']
          requested = re.split(r'[,\s]+', os.environ['REQUESTED'].strip().lower())
          if requested == ['all']:
              selected = native
          elif not requested or any(item not in allowed for item in requested):
              raise SystemExit('Use all, or a comma/space-separated list of: ' + ', '.join(allowed))
          else:
              selected = [item for item in allowed if item in requested]
          if os.environ['PROFILING'] == 'true' and os.environ['PUBLISHING'] == 'true':
              raise SystemExit('Android QML profiling builds must not be published')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('platforms=' + json.dumps(selected), file=output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print('Platforms: ' + ', '.join(selected) + '\n\nOne shared Wasm build; native jobs compile in parallel.', file=summary)
          PYTHON

      - name: Require the publishing release before parallel builds
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/github-script@v9
        with:
          script: |
            let tag;
            if (context.ref.startsWith('refs/tags/v')) {
              tag = context.ref.slice('refs/tags/'.length);
            } else {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: 'CMakeLists.txt', ref: context.sha,
              });
              const source = Buffer.from(data.content, 'base64').toString('utf8');
              const version = source.match(/project\(Decenza\s+VERSION\s+(\d+\.\d+\.\d+)\b/);
              if (!version) throw new Error('Cannot determine the publishing version');
              tag = `v${version[1]}`;
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (error) {
              if (error.status === 404) {
                throw new Error(`Create release ${tag} with its release notes/prerelease status before publishing`);
              }
              throw error;
            }
            core.info(`Release ${tag} exists before any platform can upload.`);

  wasm-bundle:
    name: Wasm bundle
    needs: plan
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    env:
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Find a reusable Qt Wasm module artifact
        id: wasm-module-artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: qt-wasm-modules-6.12.0-emscripten-5.0.5-wasm-singlethread-${{ hashFiles('tools/qtmodules-wasm/CMakeLists.txt', 'tools/qtmodules-wasm/build-ci.sh') }}
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;
            const repository = await github.rest.repos.get(context.repo);
            const trustedBranches = new Set([
              context.ref.startsWith('refs/heads/') ? context.ref.slice('refs/heads/'.length) : null,
              repository.data.default_branch,
            ].filter(Boolean));
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'release.yml', status: 'completed', per_page: 100,
            });
            for (const run of data.workflow_runs) {
              const sameRepository = run.head_repository?.id === repository.data.id;
              const trustedBranchDispatch = run.event === 'workflow_dispatch' && trustedBranches.has(run.head_branch);
              const trustedTagPush = run.event === 'push' && /^v\d/.test(run.head_branch || '');
              const workflowPath = (run.path || '').split('@')[0].replace(/^\//, '');
              if (!sameRepository || (!trustedBranchDispatch && !trustedTagPush)
                  || workflowPath !== '.github/workflows/release.yml') continue;

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'all', per_page: 100,
              });
              const wasmJob = jobs
                .filter(job => job.name === 'Wasm bundle')
                .sort((a, b) => b.id - a.id)[0];
              if (wasmJob?.conclusion !== 'success') continue;

              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, per_page: 100,
              });
              if (artifacts.data.artifacts.some(a => a.name === artifactName && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                core.info(`Found reusable module package in successful Wasm job ${wasmJob.id} of run ${run.id}.`);
                return;
              }
            }
            core.setOutput('run_id', '');
            core.info('No unexpired exact-recipe module artifact found; the module build will run.');

      - name: Download reusable Qt Wasm module artifact
        if: steps.wasm-module-artifact.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: qt-wasm-modules-6.12.0-emscripten-5.0.5-wasm-singlethread-${{ hashFiles('tools/qtmodules-wasm/CMakeLists.txt', 'tools/qtmodules-wasm/build-ci.sh') }}
          path: ${{ runner.temp }}/qt-wasm-module-artifact
          run-id: ${{ steps.wasm-module-artifact.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify and install reusable Qt Wasm modules
        if: steps.wasm-module-artifact.outputs.run_id != ''
        env:
          QT_WASM_MODULE_RECIPE_KEY: qt-wasm-modules-singlethread-6.12.0-emscripten5.0.5-${{ hashFiles('tools/qtmodules-wasm/CMakeLists.txt', 'tools/qtmodules-wasm/build-ci.sh') }}
        run: |
          python3 tools/qtmodules-wasm/verify-ci-package.py \
            "$RUNNER_TEMP/qt-wasm-module-artifact" \
            "$QT_WASM_MODULE_RECIPE_KEY" \
            "$GITHUB_WORKSPACE/build"

      - name: Match the native release version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          CURRENT=$(tr -d '[:space:]' < versioncode.txt)
          echo "$((CURRENT + 1))" > versioncode.txt

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 brotli
          # The packager decodes its Brotli output to verify it. 1.1.0-2ubuntu0.1 is
          # noble's backport of the CVE-2026-111497 decoder fix (libbrotli1 holds the
          # decoder); the CLI still reports upstream 1.1.0, so check the package.
          brotli_version="$(dpkg-query -W -f='${Version}' libbrotli1)"
          dpkg --compare-versions "$brotli_version" ge 1.1.0-2ubuntu0.1 \
            || { echo "::error::libbrotli1 $brotli_version lacks the CVE-2026-111497 fix"; exit 1; }

      - name: Set up Wasm compiler cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          key: wasm-qt6.12.0-emscripten5.0.5
          use_cache: ${{ inputs.use_cache }}
          # One cache serves the Qt modules and app for every native platform.
          # A cold build with the modules occupied ~425 MB; the app alone ~50 MB
          # (982 files, run 40267635664). Room for both.
          # Always saved: every native package waits on the Wasm bundle, so this
          # cache is on the critical path of the whole release (~5 min warm, ~15 cold).
          max-size: 512M

      - name: Configure Wasm ccache
        run: ccache --set-config=compiler_check=content

      # Host tools: the Linux job's Qt install (same modules, folder and prefix), so
      # both restore one cache entry, which main already holds, instead of a second copy.
      - name: Select Qt modules (app desktop, as the Linux job)
        id: qt_modules_host
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh app desktop)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install matching host Qt tools
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: '6.12.0'
          host: linux
          target: desktop
          arch: linux_gcc_64
          install-deps: false  # Host build tools use the minimal dependencies installed above.
          modules: ${{ steps.qt_modules_host.outputs.list }}
          cache: true
          cache-key-prefix: 'qt-linux-v4'

      - name: Remember host tools
        run: echo "DECENZA_WASM_HOST_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Select Qt modules (wasm)
        id: qt_modules
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh wasm)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # install-qt-action caches its whole `dir` (main.ts:930), so the SDK gets its
      # own: in the host's folder its entry also held the shared host Qt (483 MiB,
      # run 40278609430). aqt skips installing a host when <dir>/6.12.0/gcc_64/bin/qmake
      # is a file (metadata.py:608-613), which a symlink satisfies; tar caches the link.
      - name: Point the Wasm SDK folder at the shared host Qt
        run: |
          mkdir -p "$RUNNER_TEMP/qt-wasm-sdk/Qt/6.12.0"
          ln -sfn "$DECENZA_WASM_HOST_QT" "$RUNNER_TEMP/qt-wasm-sdk/Qt/6.12.0/gcc_64"
          test -f "$RUNNER_TEMP/qt-wasm-sdk/Qt/6.12.0/gcc_64/bin/qmake"

      - name: Install single-threaded Qt Wasm SDK
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: '6.12.0'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: ${{ steps.qt_modules.outputs.list }}
          dir: ${{ runner.temp }}/qt-wasm-sdk
          cache: true
          cache-key-prefix: qt-wasm-singlethread-6.12.0-v4

      - name: Install Emscripten 5.0.5
        # Qt 6.12's binary SDK requires this ABI: https://doc.qt.io/qt-6.12/wasm.html
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.5
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.5

      - name: Fetch stock Qt module sources
        if: steps.wasm-module-artifact.outputs.run_id == ''
        run: |
          python -m aqt install-src linux 6.12.0 --outputdir "$RUNNER_TEMP/qt-wasm-src/Qt" --archives qtmultimedia qtremoteobjects

      - name: Build stock Multimedia and Remote Objects for Wasm
        id: wasm-module-build
        if: steps.wasm-module-artifact.outputs.run_id == ''
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ccache --zero-stats
          tools/qtmodules-wasm/build-ci.sh \
            "$QT_ROOT_DIR" \
            "$DECENZA_WASM_HOST_QT" \
            "$RUNNER_TEMP/qt-wasm-src/Qt/6.12.0/Src"
          ccache --show-stats --verbose
          ccache --print-stats | awk '$1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" {calls += $2} END {exit(calls == 0)}'

      - name: Build and verify the shared app bundle
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ccache --zero-stats
          cmake -S . -B build/ci-wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$DECENZA_WASM_HOST_QT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECENZA_WASM_FAST_LINK=OFF \
            -DDECENZA_WEB_BROTLI_QUALITY=11 \
            -DDECENZA_QTRO_PREFIX="$GITHUB_WORKSPACE/build/qtro-wasm-install" \
            -DDECENZA_QTMULTIMEDIA_PREFIX="$GITHUB_WORKSPACE/build/qtmultimedia-wasm-install"
          cmake --build build/ci-wasm --parallel "$(nproc)"
          ccache --show-stats --verbose
          ccache --print-stats | awk '$1 == "cache_miss" || $1 == "direct_cache_hit" || $1 == "preprocessed_cache_hit" {calls += $2} END {exit(calls == 0)}'

      - name: Verify the compiled Wasm QML inventory
        run: |
          python tools/webclient/check_qml_inventory.py \
            --manifest "wasm=$GITHUB_WORKSPACE/build/ci-wasm/src/webclient/.qt/rcc/decenza-web_raw_qml_0.qrc"

      - name: Save the verified bundle for the native package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: matched-wasm-bundle
          path: build/ci-wasm/src/webclient/deployment/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0

      - name: Prepare verified reused module artifact for renewal
        if: steps.wasm-module-artifact.outputs.run_id != ''
        run: |
          mkdir -p build/qt-wasm-module-package
          cp -a "$RUNNER_TEMP/qt-wasm-module-artifact/." build/qt-wasm-module-package/

      - name: Package cold-built Qt Wasm modules for reuse
        id: wasm-module-package
        if: steps.wasm-module-artifact.outputs.run_id == ''
        env:
          QT_WASM_SOURCES: ${{ runner.temp }}/qt-wasm-src/Qt/6.12.0/Src
          QT_WASM_MODULE_RECIPE_KEY: qt-wasm-modules-singlethread-6.12.0-emscripten5.0.5-${{ hashFiles('tools/qtmodules-wasm/CMakeLists.txt', 'tools/qtmodules-wasm/build-ci.sh') }}
        run: |
          python3 tools/qtmodules-wasm/package-ci.py \
            "$GITHUB_WORKSPACE/build/qt-wasm-module-package" \
            "$QT_WASM_MODULE_RECIPE_KEY"

      - name: Upload reusable Qt Wasm module package
        id: wasm-module-artifact-upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qt-wasm-modules-6.12.0-emscripten-5.0.5-wasm-singlethread-${{ hashFiles('tools/qtmodules-wasm/CMakeLists.txt', 'tools/qtmodules-wasm/build-ci.sh') }}
          path: build/qt-wasm-module-package/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
          compression-level: 0

      - name: Keep the two newest reusable Qt Wasm module artifacts
        if: steps.wasm-module-artifact-upload.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: qt-wasm-modules-6.12.0-emscripten-5.0.5-wasm-singlethread-${{ hashFiles('tools/qtmodules-wasm/CMakeLists.txt', 'tools/qtmodules-wasm/build-ci.sh') }}
        with:
          script: |
            const artifactName = process.env.ARTIFACT_NAME;
            const repository = await github.rest.repos.get(context.repo);
            const trustedBranches = new Set([
              context.ref.startsWith('refs/heads/') ? context.ref.slice('refs/heads/'.length) : null,
              repository.data.default_branch,
            ].filter(Boolean));
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100,
            });
            const candidates = all
              .filter(a => a.name === artifactName && !a.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const valid = [];
            for (const artifact of candidates) {
              const runId = artifact.workflow_run?.id;
              if (!runId) continue;
              if (runId === context.runId) {
                valid.push(artifact);
                continue;
              }
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
              const sameRepository = run.head_repository?.id === repository.data.id;
              const trustedBranchDispatch = run.event === 'workflow_dispatch' && trustedBranches.has(run.head_branch);
              const trustedTagPush = run.event === 'push' && /^v\d/.test(run.head_branch || '');
              const workflowPath = (run.path || '').split('@')[0].replace(/^\//, '');
              if (!sameRepository || (!trustedBranchDispatch && !trustedTagPush)
                  || workflowPath !== '.github/workflows/release.yml') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: runId, filter: 'all', per_page: 100,
              });
              const wasmJob = jobs
                .filter(job => job.name === 'Wasm bundle')
                .sort((a, b) => b.id - a.id)[0];
              if (wasmJob?.conclusion === 'success') valid.push(artifact);
            }
            for (const artifact of valid.slice(2)) {
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
              core.info(`Deleted older reusable module artifact ${artifact.id}.`);
            }

  build-android:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.platforms), 'android') }}
    concurrency:
      group: native-android-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'project.*VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # JDK 21, not 17: Qt for Android's own prerequisites page states "Qt for
      # Android development requires JDK 21 or above". 17 built fine, but it is
      # below the floor Qt supports, so a future Qt gradle template is free to
      # stop working on it. AGP 9.2.1 and the Gradle 9.5.1 Qt 6.12's wrapper runs
      # both support 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install minimal host dependencies
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1 ninja-build

      # Pin the Python aqtinstall runs on. aqt 3.3.0 (latest, 2025-06-02) extracts
      # Qt's .7z archives via zipfile.is_zipfile, which false-positives on some of
      # them -- it then tries to read a 7z as a zip and dies with
      # `BadZipFile: Bad offset for central directory`. It took out the Qt 6.11.2
      # aarch64 qtdeclarative archive and with it every Linux ARM64 release build.
      # The detection fix is python/cpython#72680, first shipped in Python 3.14, so
      # 3.14 is the MINIMUM that works rather than merely the newest.
      # Set on all six workflows deliberately: which Python aqt gets should be one
      # answer, not six accidental ones. Remove when aqtinstall ships a fix --
      # tracking https://github.com/miurahr/aqtinstall/issues/1042
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Select Qt modules (app)
        id: qt_modules
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh app)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          # install-qt-action >= 4.4.0 resolves the version first with
          # `aqt list-qt <host> android --spec X --latest-version` (#335), and aqt
          # lists Qt >= 6.8 Android packages only under all_os -- under `linux` the
          # list stops at 6.7.3 and the step fails before the cache lookup. aqt's
          # --autodesktop still installs the Linux host Qt alongside it.
          host: 'all_os'
          version: ${{ env.QT_VERSION }}
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: ${{ steps.qt_modules.outputs.list }}
          install-deps: false  # Skip apt-get of 61 desktop packages — only libegl1/libgl1 needed for qsb shader compiler
          cache: true
          cache-key-prefix: 'qt-android-v1'

      - name: Install instrumented QtQml
        run: |
          # Keep the downloaded SDK cache stock and reject a different Qt build.
          printf '%s  %s\n' \
            9c369a8da4adef65bd090fed1f846ca480f12e6cd36c6728a9c5e54a9da178af "$QT_ROOT_DIR/lib/libQt6Qml_arm64-v8a.so" \
            cc21256f62e350d9e66ca729d71ca96ea72498f0379f808dc8a981e02fb2e248 "$QT_ROOT_DIR/lib/libQt6Core_arm64-v8a.so" | sha256sum --check
          STAGED_QT="$RUNNER_TEMP/qt-android-gc"
          cp -a "$QT_ROOT_DIR" "$STAGED_QT"
          rm -f "$STAGED_QT/lib/libQt6Qml_arm64-v8a.so"
          cp android/qt-overrides/libQt6Qml_arm64-v8a.so "$STAGED_QT/lib/libQt6Qml_arm64-v8a.so"
          echo "QT_ROOT_DIR=$STAGED_QT" >> "$GITHUB_ENV"
          echo "$STAGED_QT/bin" >> "$GITHUB_PATH"

      - name: Install Android NDK and compile platform
        run: |
          # The compile platform is stated once, in CMakeLists.txt.
          PLATFORM=$(grep -oP 'QT_ANDROID_COMPILE_SDK_VERSION "\K[^"]+' CMakeLists.txt)
          echo "Compile platform: $PLATFORM"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;$PLATFORM"

          # Try to detect which NDK version Qt expects
          QT_NDK_VERSION=""
          for TOOLCHAIN in "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
                           "$QT_ROOT_DIR/lib/cmake/Qt6/android.toolchain.cmake"; do
            if [ -f "$TOOLCHAIN" ] && [ -z "$QT_NDK_VERSION" ]; then
              QT_NDK_VERSION=$(grep -oP 'ANDROID_NDK_REVISION\s+"?\K[0-9.]+' "$TOOLCHAIN" 2>/dev/null || true)
            fi
          done

          # Fallback: the NDK Qt 6.12 documents (r27c), matching the local dev NDK
          if [ -z "$QT_NDK_VERSION" ]; then
            QT_NDK_VERSION="27.2.12479018"
          fi

          echo "NDK version needed: $QT_NDK_VERSION"

          # Install if not already present
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$QT_NDK_VERSION" ]; then
            echo "Installing NDK $QT_NDK_VERSION..."
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$QT_NDK_VERSION"
          else
            echo "NDK $QT_NDK_VERSION already installed"
          fi

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$QT_NDK_VERSION" >> $GITHUB_ENV

      - name: Set up ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          key: 'android-arm64'
          # A profiling build's global QT_QML_DEBUG define misses every cached object, and
          # saving it would hand the next release build a cache of the wrong objects.
          use_cache: ${{ inputs.qml_profiling && 'false' || inputs.use_cache }}
          # Android is the CI build that matters most. At 1G it sat full and ran
          # 35 cleanups during one build (2026-10-06); 1.3G leaves room to grow,
          # paid for by macOS keeping no caches.
          max-size: 1300M

      # androiddeployqt's "Creating APK" step otherwise downloads the full
      # gradle distribution and re-resolves every dependency on each run
      # (~1m14s of the job). Stable key: an exact hit skips re-saving, so
      # this entry never accumulates timestamped copies. The Qt version
      # pins the gradle/AGP generation — bump the key with Qt upgrades.
      - name: Cache Gradle (androiddeployqt)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-qt6.12.0-${{ hashFiles('android/build.gradle', 'android/settings.gradle') }}
          restore-keys: |
            gradle-android-qt6.12.0-

      - name: Configure ccache for CI
        run: ccache --set-config=compiler_check=content

      - name: Wrap NDK compilers with ccache
        run: |
          # Qt's Android toolchain overrides CMAKE_*_COMPILER_LAUNCHER,
          # so we wrap the actual NDK compiler binaries with ccache instead.
          # We must wrap ALL clang variants: bare clang/clang++, versioned
          # clang-NN, and target-triple prefixed (aarch64-linux-androidNN-clang).
          NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Find the real clang binary (resolve all symlinks)
          REAL_CLANG="$(readlink -f "$NDK_BIN/clang")"
          echo "Real clang: $REAL_CLANG"

          # Wrap every clang/clang++ variant in the NDK bin directory
          for COMP in "$NDK_BIN"/clang "$NDK_BIN"/clang++ "$NDK_BIN"/clang-[0-9]* "$NDK_BIN"/*-clang "$NDK_BIN"/*-clang++; do
            [ -e "$COMP" ] || continue
            # Skip the real binary itself
            RESOLVED="$(readlink -f "$COMP")"
            if [ "$RESOLVED" = "$REAL_CLANG" ] && [ "$(basename "$COMP")" = "$(basename "$REAL_CLANG")" ]; then
              echo "Skipping real binary: $COMP"
              continue
            fi

            # Determine if this is a C++ variant
            case "$(basename "$COMP")" in
              *clang++*|*c++*) DRIVER_FLAG="--driver-mode=g++ " ;;
              *) DRIVER_FLAG="" ;;
            esac

            rm -f "$COMP"
            printf '#!/bin/sh\nexec ccache "%s" %s"$@"\n' "$REAL_CLANG" "$DRIVER_FLAG" > "$COMP"
            chmod +x "$COMP"
            echo "Wrapped $(basename "$COMP") -> ccache $(basename "$REAL_CLANG") $DRIVER_FLAG"
          done

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a release APK cannot be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/keystore.jks
          echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          # PCH off: a compile that consumes a PCH is uncacheable, so leaving it
          # on made ccache miss ~88% of this leg's compiles. See PR #1738.
          $QT_ROOT_DIR/bin/qt-cmake .. -G Ninja \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DDECENZA_WEB_BUNDLE_MODE=OFF \
            -DENABLE_TSNET=ON \
            -DDECENZA_ENABLE_PCH=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DDECENZA_QML_DEBUG=${{ inputs.qml_profiling && 'ON' || 'OFF' }} \
            -DQT_ANDROID_SIGN_APK=ON

      - name: Compile native app while Wasm builds
        run: cmake --build build --config Release --target Decenza --parallel

      - name: Snapshot QML objects before embedding
        run: python3 tools/webclient/check_qml_object_reuse.py snapshot build "$RUNNER_TEMP/native-qml-objects.json"

      - name: Add the verified Wasm bundle before packaging
        uses: ./.github/actions/finish-webclient
        with:
          build-directory: build
          relink: false

      # androiddeployqt signs with apksigner from these (androiddeployqt/main.cpp:469-492)
      # and fails the build if the path or alias is missing.
      - name: Build
        env:
          QT_ANDROID_KEYSTORE_ALIAS: de1-key
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd build
          cmake --build . --config Release --parallel $(nproc)

      - name: Require QML object reuse after embedding
        run: python3 tools/webclient/check_qml_object_reuse.py check build "$RUNNER_TEMP/native-qml-objects.json"

      - name: Name the signed APK
        id: apk
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mapfile -t SIGNED < <(find build -name "*-release-signed.apk" -type f)
          if [ "${#SIGNED[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed release APK, found ${#SIGNED[@]}:"
            find build -name "*.apk" -type f
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -not -name "*.bat" -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${SIGNED[0]}"
          APK="$(dirname "${SIGNED[0]}")/Decenza_${VERSION}.apk"
          cp "${SIGNED[0]}" "$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Verify instrumented QtQml in the APK
        run: |
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -p "${{ steps.apk.outputs.apk_path }}" lib/arm64-v8a/libQt6Qml_arm64-v8a.so > "$RUNNER_TEMP/apk-qtqml.so"
          EXPECTED=$("$READELF" -n android/qt-overrides/libQt6Qml_arm64-v8a.so | awk '/Build ID:/ {print $NF}')
          ACTUAL=$("$READELF" -n "$RUNNER_TEMP/apk-qtqml.so" | awk '/Build ID:/ {print $NF}')
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"
          echo "Verified QtQml build ID: $ACTUAL"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.qml_profiling && 'Decenza-Android-arm64-qmlprofiling' || 'Decenza-Android-arm64' }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 1
          overwrite: true

      # The link output, before packaging: simpleperf names C++ frames from it
      # (app_profiler.py -lib <dir containing it>).
      - name: Upload unstripped library for simpleperf
        if: ${{ inputs.qml_profiling }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Decenza-Android-arm64-symbols
          path: build/libDecenza_arm64-v8a.so
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APK="${{ steps.apk.outputs.apk_path }}"

          # Find the release tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi

          echo "Uploading to release: $TAG"

          # Check if release exists, create if not
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "Decenza $TAG" \
              --generate-notes
          fi

          # Upload APK
          if [ -n "$APK" ] && [ -f "$APK" ]; then
            gh release upload "$TAG" "$APK" --clobber
          fi

      - name: Inject build number into release notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BUILD_CODE="${{ steps.bump.outputs.build_code }}"

          # Get current release notes
          CURRENT_NOTES=$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || echo "")

          # Update existing Build: line, or inject one if not present
          if echo "$CURRENT_NOTES" | grep -qE "^Build:? [0-9]+"; then
            # Replace existing Build: line with new build number
            NEW_NOTES=$(echo "$CURRENT_NOTES" | sed -E "s/^Build:? [0-9]+/Build: $BUILD_CODE/")
            gh release edit "$TAG" --notes "$NEW_NOTES"
            echo "Updated Build: $BUILD_CODE in release notes"
          elif [ -z "$CURRENT_NOTES" ]; then
            gh release edit "$TAG" --notes "Build: $BUILD_CODE"
            echo "Injected Build: $BUILD_CODE into release notes"
          else
            # Insert Build: line after first heading or at the top
            NEW_NOTES=$(echo "$CURRENT_NOTES" | sed "0,/^## /{s/^## \(.*\)/## \1\n\nBuild: $BUILD_CODE/}")
            # If no heading was found (sed didn't change anything), prepend
            if [ "$NEW_NOTES" = "$CURRENT_NOTES" ]; then
              NEW_NOTES="Build: $BUILD_CODE

          $CURRENT_NOTES"
            fi
            gh release edit "$TAG" --notes "$NEW_NOTES"
            echo "Injected Build: $BUILD_CODE into release notes"
          fi

      - name: Commit version code back to main
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          BUILD_CODE="${{ steps.bump.outputs.build_code }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Preserve .ccache before stash (stash --include-untracked would wipe it)
          [ -d .ccache ] && mv .ccache /tmp/.ccache-preserve
          git stash --include-untracked
          git checkout origin/main
          [ -d /tmp/.ccache-preserve ] && mv /tmp/.ccache-preserve .ccache
          echo "$BUILD_CODE" > versioncode.txt
          git add versioncode.txt
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No version code changes to commit"
          else
            git commit -m "ci: bump version code to $BUILD_CODE [skip ci]"
            # Retry push with rebase in case main advanced during the build
            PUSH_OK=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Committed version code $BUILD_CODE back to main"
                PUSH_OK=true
                break
              else
                echo "Push failed (attempt $attempt/3), rebasing..."
                git pull --rebase origin main
              fi
            done
            if [ "$PUSH_OK" != "true" ]; then
              echo "::warning::Could not push version code $BUILD_CODE back to main after 3 attempts"
            fi
          fi

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f $RUNNER_TEMP/keystore.jks || true

  build-ios:
    needs: plan
    if: ${{ contains(fromJSON(needs.plan.outputs.platforms), 'ios') }}
    concurrency:
      group: native-ios-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # Full history for version tags

      - name: Bump version code
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: bump
        run: |
          CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
          NEXT=$((CURRENT + 1))
          echo "$NEXT" > versioncode.txt
          echo "build_code=$NEXT" >> $GITHUB_OUTPUT
          echo "Version code bumped: $CURRENT -> $NEXT"

      - name: Set up Xcode (pin + deployment-target shims)
        uses: ./.github/actions/setup-xcode
        with:
          xcode-version: '26.4.1'
      - name: Pin Python for aqtinstall (aqtinstall#1042)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Select Qt modules (app)
        id: qt_modules
        shell: bash
        run: |
          list="$(bash scripts/qt_modules.sh app)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # The iOS Qt's host tools come from a macOS desktop Qt (QT_HOST_PATH). The
      # action passes --autodesktop only when aqt reports >= 3.0.0, and the pinned
      # fork commit below reports v0.1.devN (no release tags), so install the host
      # explicitly, as the macOS job does. The iOS step then sets QT_HOST_PATH from
      # its target_qt.conf (HostPrefix=../../macos).
      - name: Install host Qt (macOS desktop)
        uses: jurplel/install-qt-action@v4
        with:
          setup-python: false
          version: '6.12.0'
          target: 'desktop'
          arch: 'clang_64'
          modules: ${{ steps.qt_modules.outputs.list }}
          cache: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqt runs on the Python pinned above, not one this action installs.
          setup-python: false
          version: '6.12.0'
          target: 'ios'
          # Qt 6.12.0 split iOS into qt6_6120_device / _simulator_* folders built
          # with the release (6.12.0-0-202609280346). The old combined `ios`
          # package aqt 3.3 installs is a July snapshot (6.12.0-0-202607081031)
          # whose Qt6QmlMacros.cmake predates _qt_internal_qml_get_cachegen_compiled_file,
          # which broke configure. aqt 3.3 knows only `ios`; ios_device comes from
          # miurahr/aqtinstall#1048 (open, unmerged), pinned to its head commit.
          # TODO: when an aqtinstall release supports ios_device, drop `aqtsource`.
          arch: 'ios_device'
          aqtsource: 'git+https://github.com/jdpurcell/aqtinstall.git@6f0f842da47c744cdc814cd94da9828d934d7bf0'
          modules: ${{ steps.qt_modules.outputs.list }}
          # Qt-for-iOS caching is intentionally disabled. The iOS Qt cache is too
          # large to coexist with the other platforms under GitHub's 10 GB per-repo
          # cache cap: even after stale-ccache pruning (now prune-caches.yml)
          # trimmed the duplicate ccache piles to ~7.3 GB, re-enabling iOS Qt caching
          # was MEASURED at 3.96 GB for the single qt-ios cache entry (it barely
          # compresses), pushing the store to 10.53 GB — over the cap and back into
          # LRU-eviction thrash. See the experiment in PR #1383 (re-enable) and its
          # revert. iOS is our least cache-critical build, so it pays the ~5 min cold
          # Qt-install cost to keep windows/macos/linux/android Qt caches resident.
          # Do NOT re-enable without first shrinking the iOS Qt cache (e.g. trimming
          # unused modules) so the total stays comfortably under 10 GB.
          cache: false

      - name: Set up ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          # sN is the setup-xcode shim revision (s3: clang++ runs in g++
          # driver mode). Bump it whenever the shim changes: ccache's
          # compiler_check sees the same `-v` banner from clang.real
          # whatever the shim does, so a key bump is the only reliable way
          # to invalidate.
          key: 'ios-arm64-xcode26.4.1-s3'
          use_cache: ${{ inputs.use_cache }}

      - name: Configure ccache for CI
        # Run %compiler% -v so the hash captures the real compiler the shim
        # execs (clang.real), not just the shim shell script. This catches
        # underlying Xcode upgrades automatically. (Shim-script changes
        # still need a manual cache-key bump above — see comment there.)
        run: ccache --set-config=compiler_check='%compiler% -v'

      - name: Configure CMake
        run: |
          $QT_ROOT_DIR/bin/qt-cmake -S . -B build/ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g" \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDECENZA_WEB_BUNDLE_MODE=OFF -DENABLE_TSNET=ON

      - name: Compile iOS app with Ninja while Wasm builds
        run: cmake --build build/ios --target Decenza --parallel

      - name: Add the verified Wasm bundle before packaging
        uses: ./.github/actions/finish-webclient
        with:
          build-directory: build/ios

      - name: Inject widget extension target
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          WIDGET_PROVISIONING_PROFILE_NAME: ${{ secrets.WIDGET_PROVISIONING_PROFILE_NAME }}
        run: |
          # Xcode only packages Ninja's app and builds the shared widget.
          gem install --no-document xcodeproj
          ruby ios/inject_widget_extension.rb \
            build/ios/Decenza.xcodeproj \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/build/ios/Decenza.app"

      - name: Install Apple certificate and provisioning profile
        env:
          P12_CERTIFICATE_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode from base64
          echo -n "$P12_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile (must use UUID as filename)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Installed profile with UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

          # Second profile: the widget app-extension is a separate bundle id
          # (io.github.kulitorum.decenza.widget) and needs its own
          # distribution profile, or CodeSignOnCopy of the .appex fails.
          WIDGET_PROFILE_PATH=$RUNNER_TEMP/widget_profile.mobileprovision
          echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $WIDGET_PROFILE_PATH
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $WIDGET_PROFILE_PATH))
          cp $WIDGET_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_PROFILE_UUID.mobileprovision
          echo "Installed widget profile with UUID: $WIDGET_PROFILE_UUID"

      - name: Build and Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/ios

          # Build archive. No global PROVISIONING_PROFILE_SPECIFIER: a
          # command-line specifier applies to ALL targets and would clobber
          # the extension's own profile. Both targets carry their per-target
          # profile in-project (set by inject_widget_extension.rb).
          # Ninja has already compiled the app. Xcode builds the widget,
          # installs the prebuilt app and produces Apple's signed archive.
          xcodebuild archive \
            -project Decenza.xcodeproj \
            -scheme Decenza \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/Decenza.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="iPhone Distribution"

      - name: Verify widget extension in archive
        run: |
          # The pbxproj injection is the single most failure-prone step; a
          # missing .appex means a green build that silently ships no widget.
          APPEX="$RUNNER_TEMP/Decenza.xcarchive/Products/Applications/Decenza.app/PlugIns/DecenzaWidgetExtension.appex"
          if [ ! -d "$APPEX" ]; then
            echo "::error::Widget extension missing from archive — pbxproj injection did not take"
            exit 1
          fi
          echo "Widget extension present in archive: $APPEX"

      - name: Verify Ninja executable survived archiving
        run: |
          NINJA_UUID=$(xcrun dwarfdump --uuid build/ios/Decenza.app/Decenza | awk '{print $2}')
          ARCHIVE_APP="$RUNNER_TEMP/Decenza.xcarchive/Products/Applications/Decenza.app"
          ARCHIVE_UUID=$(xcrun dwarfdump --uuid "$ARCHIVE_APP/Decenza" | awk '{print $2}')
          test -n "$NINJA_UUID" && test "$NINJA_UUID" = "$ARCHIVE_UUID"
          DSYM_UUID=$(xcrun dwarfdump --uuid "$RUNNER_TEMP/Decenza.xcarchive/dSYMs/Decenza.app.dSYM" | awk '{print $2}')
          test "$NINJA_UUID" = "$DSYM_UUID"
          codesign --verify --deep --strict "$ARCHIVE_APP"

      - name: Export IPA
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          WIDGET_PROFILE_NAME: ${{ secrets.WIDGET_PROVISIONING_PROFILE_NAME }}
        run: |
          # Unlock keychain for export
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Create export options plist using profile UUID from env
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>iPhone Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>io.github.kulitorum.decenza</key>
                  <string>Decenza App Store</string>
                  <key>io.github.kulitorum.decenza.widget</key>
                  <string>${WIDGET_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST

          echo "Export options:"
          cat $RUNNER_TEMP/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Decenza.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates

      - name: Verify widget extension in IPA
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ] || ! unzip -l "$IPA" | grep -q 'DecenzaWidgetExtension.appex'; then
            echo "::error::Widget extension missing from exported IPA"
            exit 1
          fi
          echo "Widget extension present in IPA: $IPA"

      # Kept with the release for reference. It is App Store-signed, so it installs
      # only through TestFlight or the App Store, never by sideloading. The updater
      # ignores .ipa assets (updatechecker.cpp: iOS updates come from the App Store).
      - name: Upload IPA to GitHub Release
        if: ${{ inputs.upload_to_release == true || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'project.*VERSION' CMakeLists.txt | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          IPA_NAME="Decenza_v${VERSION}_ios.ipa"
          cp "$RUNNER_TEMP/export/Decenza.ipa" "$RUNNER_TEMP/$IPA_NAME"
          echo "Uploading $IPA_NAME to release: $TAG"
          gh release upload "$TAG" "$RUNNER_TEMP/$IPA_NAME" --clobber

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_release || startsWith(github.ref, 'refs/tags/v') }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Decode API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          # Upload using altool
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Decenza.ipa" \
            --type ios \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_API_ISSUER_ID

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Decenza-iOS
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 1
          overwrite: true

      - name: Find dSYMs
        run: |
          echo "# Checking xcarchive dSYMs directory:"
          ls -la $RUNNER_TEMP/Decenza.xcarchive/dSYMs/ 2>/dev/null || echo "(empty or missing)"
          echo ""
          echo "# Checking build output:"
          ls -la build/ios/Release-iphoneos/*.dSYM 2>/dev/null || echo "(not in build output)"
          echo ""
          echo "# Searching workspace for all .dSYM bundles:"
          find $GITHUB_WORKSPACE -name "*.dSYM" -type d 2>/dev/null || echo "(none found in workspace)"
