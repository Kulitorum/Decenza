name: Prune stale compiler caches

# ccache-action / sccache write a NEW timestamp-suffixed cache entry every
# build (GH caches are immutable, so the action can't update in place — it
# finds the latest via prefix restore-keys). Old copies are never cleaned up,
# so stale copies of each platform's compiler cache pile up and push the repo
# toward GitHub's 10 GB cap, triggering LRU eviction of still-useful Qt/ccache
# entries and causing cold builds.
#
# This used to be a final step inside macos-release.yml, on the assumption that
# macOS was the slowest build so every other platform had already saved its
# fresh cache by prune time. That stopped holding (Linux x64 now outlasts
# macOS), and the in-build prune could never see the running build's own cache
# (ccache-action saves in a post-job step), so it had to keep 2 copies per
# group and still left 3 copies for any platform finishing after macOS.
#
# As a standalone workflow triggered when a build workflow completes — and
# skipping while any build is still in progress or queued — every fresh cache
# is already saved when we prune, so keeping exactly 1 copy per (prefix, ref)
# group is safe. The last build to finish re-triggers us, so the skip never
# strands stale entries.

on:
  workflow_run:
    workflows:
      - 'Android APK Build'
      - 'iOS App Store Build'
      - 'macOS Build'
      - 'Windows Build'
      - 'Linux AppImage Build'
      - 'Linux ARM64 AppImage Build'
      # Added when the sanitizer nightly gained a ccache: it now writes two
      # timestamped entries a night, so it needs pruning like any other. It is
      # also in the gate regex below, so a prune cannot run while it is still
      # building and miss the cache it is about to save.
      - 'Nightly sanitizers'
    types: [completed]
  # Nearly all builds run on TAG pushes, and GitHub's docs don't clearly
  # guarantee workflow_run fires for tag-triggered runs (no `branches:`
  # filter here, so it should — but field reports show this edge being
  # flaky). The daily cron is the guaranteed fallback: pruning is
  # idempotent and takes seconds, so a redundant pass is free.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write  # gh cache delete / gh run list

concurrency:
  group: prune-caches
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Skip while builds are running
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # If any build workflow is still queued or running, its compiler
          # cache hasn't been saved yet — pruning now would repeat the old
          # in-build prune's blind spot. Skip; the completion of that run
          # fires this workflow again.
          BUILD_WORKFLOWS='Android APK Build|iOS App Store Build|macOS Build|Windows Build|Linux AppImage Build|Linux ARM64 AppImage Build|Nightly sanitizers'
          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json workflowName,status \
            --jq '[.[] | select((.status == "in_progress" or .status == "queued"))
                        | .workflowName] | unique | .[]' \
            | grep -cE "^($BUILD_WORKFLOWS)$" || true)
          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "$ACTIVE build workflow(s) still active — skipping prune."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build workflows active — pruning."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prune stale ccache/sccache entries
        if: ${{ steps.gate.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Keep the newest copy of each timestamped ccache/sccache prefix,
          # grouped per ref so a main-scoped entry survives a newer tag-push
          # build. qt-*/openssl-* use stable keys (no timestamp suffix) and are
          # excluded by the regex filter — they are exactly the caches we want
          # to keep restorable. gh's built-in --jq does not accept --arg /
          # --argjson, so pipe to real jq.
          KEEP=1
          TS='-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$'
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 500 \
            --json id,key,createdAt,ref \
            | jq -r --argjson keep "$KEEP" --arg ts "$TS" '
                map(select(.key | test($ts)))
                | group_by((.key | sub($ts; "")) + "@@" + .ref)
                | map(sort_by(.createdAt) | reverse | .[$keep:])
                | flatten
                | .[] | "\(.id)\t\(.key)"
              ' \
            | while IFS=$'\t' read -r id key; do
                [ -n "$id" ] || continue
                if gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; then
                  echo "- deleted \`$key\` (id $id)" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::Failed to delete cache $key (id $id)"
                fi
              done

      # Compiler caches left behind by release tags that have SHIPPED.
      #
      # The step above keeps one copy per (prefix, ref) and is right to. What it
      # cannot see is that a shipped tag stops being a ref anyone builds: the
      # release process re-tags and force-pushes the SAME tag while iterating,
      # so that tag's cache is hot (nine v2.0.0 macOS builds in three days, each
      # restoring the last), and then the next version takes over and the old
      # tag's whole set goes cold at once. GitHub scopes restores to the entry's
      # own ref, so no other tag can ever read it — cold here means unreachable,
      # not merely stale.
      #
      # Measured 2026-07-28: v2.0.0 held 3045 MB — macOS 1870, iOS 467, Linux
      # x64 457, Windows 251 — while v2.0.1 was the current release. Four
      # entries because that is what v2.0.0 happened to leave; six workflows use
      # the cache action and v2.0.1 left six, 1.48 GB. Either way it is ~30% of
      # the 10 GB cap held by a tag nothing will build again, and it was pushing
      # the nightly sanitizer job into its cold-build yield every night.
      #
      # The NEWEST tag is kept, and that is the whole point rather than a
      # caveat: it is the release currently being iterated on, and collecting it
      # would make the next re-tag rebuild from scratch. Ordering is by build
      # time for the same reason — see the note on NEWEST below.
      #
      # Scoped tightly, since the surrounding steps are conservative about tags
      # for good reason: only timestamped ccache/sccache keys, only on tag refs,
      # only for tags that sort older than the newest one present. Stable-key
      # entries (qt-*, openssl-*, gradle-*) are never touched.
      - name: Drop compiler caches for superseded release tags
        if: ${{ steps.gate.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TS='-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$'

          # Tag-scoped entries surface as refs/heads/refs/tags/X (the odd shape
          # the deleted-branch step below skips) as well as plain refs/tags/X.
          # The whole `refs/heads/` is what is optional — `refs/(heads/)?refs/`
          # only matches the quirk shape and a `refs/refs/` that never occurs,
          # so a plain refs/tags/X would silently select nothing.
          if ! RAW=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 500 \
                       --json id,key,ref,sizeInBytes,createdAt); then
            echo "::error::Could not list caches — the superseded-tag prune did NOT run."
            exit 1
          fi
          # --limit 500 is gh's ceiling and truncation is invisible: the listing
          # is ordered by last-accessed descending, so what falls off the end is
          # precisely the stale entries this step exists to collect.
          if [ "$(printf '%s' "$RAW" | jq length)" -ge 500 ]; then
            echo "::warning::Cache listing hit the 500-entry limit; this prune may be partial."
          fi
          if ! CACHES=$(printf '%s' "$RAW" | jq -r --arg ts "$TS" '
                       .[]
                       | select(.key | test($ts))
                       | select(.ref | test("^(refs/heads/)?refs/tags/"))
                       | "\(.id)\t\(.ref | sub("^(refs/heads/)?refs/tags/"; ""))\t\(.sizeInBytes)\t\(.key)"
                     '); then
            echo "::error::Could not parse the cache listing (renamed --json field?) — the superseded-tag prune did NOT run."
            exit 1
          fi

          # Report what was actually observed. "No tag caches" and "the listing
          # never happened" have to look different in the log, or this step
          # asserts a fact about the store it never read — the failure the
          # nightly's reclaim was rewritten to stop making.
          if [ -z "$CACHES" ]; then
            echo "Listed $(printf '%s' "$RAW" | jq length) caches; none are tag-scoped."
            exit 0
          fi

          # Newest by BUILD TIME, not by version sort. What this step protects is
          # the tag currently being rebuilt, which is a question about when it
          # last built, not about how its name sorts. `sort -V` gets both real
          # cases wrong: it ranks a hotfix released after a higher version as
          # older (v1.9.5 after v2.0.0) and, under GNU filevercmp, ranks
          # v2.1.0-beta ABOVE v2.1.0, so it would keep the beta and collect the
          # shipped tag mid-release. createdAt has neither failure and needs no
          # assumption about the tag scheme.
          #
          # Self-contained on purpose: a tag whose build is still running cannot
          # appear here anyway, because the gate step skips the whole workflow
          # while any build is active.
          NEWEST=$(printf '%s' "$RAW" | jq -r --arg ts "$TS" '
                     [ .[]
                       | select(.key | test($ts))
                       | select(.ref | test("^(refs/heads/)?refs/tags/")) ]
                     | max_by(.createdAt)
                     | .ref | sub("^(refs/heads/)?refs/tags/"; "")
                   ')
          CANDIDATES=$(printf '%s\n' "$CACHES" | awk -F'\t' -v n="$NEWEST" '$2 != n' | grep -c . || true)
          echo "Newest tag with caches: $NEWEST (keeping its entries); $CANDIDATES entr(y|ies) on older tags."

          freed=0
          deleted=0
          while IFS=$'\t' read -r id tag size key; do
            [ -n "$id" ] || continue
            [ "$tag" = "$NEWEST" ] && continue
            mb=$(( size / 1024 / 1024 ))
            if err=$(gh cache delete "$id" --repo "$GITHUB_REPOSITORY" 2>&1); then
              echo "- deleted \`$key\` (${mb} MB) — tag $tag superseded by $NEWEST" \
                >> "$GITHUB_STEP_SUMMARY"
              freed=$(( freed + mb ))
              deleted=$(( deleted + 1 ))
            else
              echo "::warning::Failed to delete cache $key (id $id): $err"
            fi
          done <<< "$CACHES"

          # Attempted vs succeeded, to the step summary rather than a stdout
          # line nobody opens: "Reclaimed 0 MB" alone reads the same whether
          # nothing needed collecting or every delete was refused.
          echo "Reclaimed ${freed} MB from ${deleted}/${CANDIDATES} superseded entries." \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$CANDIDATES" -gt 0 ] && [ "$deleted" -eq 0 ]; then
            echo "::error::$CANDIDATES entr(y|ies) on superseded tags and none could be deleted — nothing was reclaimed."
            exit 1
          fi

      # Platform compiler caches on main, which nothing seeds any more.
      #
      # These existed for one reason: the FIRST build of a new tag has an empty
      # tag scope, and GitHub lets it fall back to the default branch's. They
      # were written by warm-main-cache.yml, which dispatched all six builds on
      # main when a release was promoted out of prerelease — an event this
      # project usually never reaches. Four firings ever (2026-05-28, 06-17,
      # 07-10, 07-24). That workflow is now deleted, so nothing writes these
      # again and their hit rate only decays.
      #
      # Measured 2026-07-28: 953 MB — macOS 347, iOS 329, Android 119, Linux x64
      # 70, Windows 52, Linux arm64 36. The cost of dropping them is one cold
      # build per platform per release; every rebuild after that restores the
      # tag's own cache, and this project re-tags repeatedly (nine v2.0.0 macOS
      # builds in three days), so it is one build in nine, not one in one.
      #
      # EXCLUDES ccache-sanitizers-*, which main legitimately owns: the nightly
      # runs on main, rewrites them nightly, and restores them the next night.
      # Collecting those would undo the reclaim the nightly half of this work
      # exists to fix. Stable-key entries (qt-*, openssl-*, gradle-*) carry no
      # timestamp and are excluded by TS, as everywhere else here.
      - name: Drop main-scoped platform compiler caches
        if: ${{ steps.gate.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TS='-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$'
          KEEP='^ccache-sanitizers-'

          if ! RAW=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 500 \
                       --json id,key,ref,sizeInBytes); then
            echo "::error::Could not list caches — the main-scope prune did NOT run."
            exit 1
          fi
          ROWS=$(printf '%s' "$RAW" | jq -r --arg ts "$TS" --arg keep "$KEEP" '
                   .[]
                   | select(.ref == "refs/heads/main")
                   | select(.key | test($ts))
                   | select(.key | test($keep) | not)
                   | "\(.id)\t\(.sizeInBytes)\t\(.key)"
                 ')
          if [ -z "$ROWS" ]; then
            echo "Listed $(printf '%s' "$RAW" | jq length) caches; no main-scoped platform compiler caches to collect."
            exit 0
          fi

          freed=0
          deleted=0
          candidates=$(printf '%s\n' "$ROWS" | grep -c . || true)
          while IFS=$'\t' read -r id size key; do
            [ -n "$id" ] || continue
            mb=$(( size / 1024 / 1024 ))
            if err=$(gh cache delete "$id" --repo "$GITHUB_REPOSITORY" 2>&1); then
              echo "- deleted \`$key\` (${mb} MB) — main-scoped, nothing seeds these now" \
                >> "$GITHUB_STEP_SUMMARY"
              freed=$(( freed + mb ))
              deleted=$(( deleted + 1 ))
            else
              echo "::warning::Failed to delete cache $key (id $id): $err"
            fi
          done <<< "$ROWS"
          echo "Reclaimed ${freed} MB from ${deleted}/${candidates} main-scoped platform entries." \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$deleted" -eq 0 ]; then
            echo "::error::$candidates main-scoped platform entr(y|ies) and none could be deleted."
            exit 1
          fi

      # Caches for refs that no longer exist. The step above dedupes WITHIN a
      # ref and is correct at that job, but it has no concept of a ref that has
      # ceased to exist: every entry on a deleted branch is the newest of its
      # (prefix, ref) group, so prune inspects them and rightly finds nothing to
      # collapse — while the branch was deleted hours ago.
      #
      # Measured on 2026-07-19, hours after one feature branch was merged and
      # deleted: 4436 MB across 12 entries on that dead branch, plus 606 MB on
      # its merged PR's refs/pull/N/merge — 5.0 GB, HALF the 10 GB cap, held by
      # refs nothing could ever restore from. The repo sat at 9.91/10 GB and was
      # LRU-evicting live entries to make room for dead ones.
      #
      # GitHub does eventually reclaim these on its own, but "eventually" is not
      # a schedule, and at 99% of cap the dead entries are actively pushing out
      # the live ones. Note this is not the same failure as the timestamped
      # pile-up above; it needed a separate fix because it has a separate cause.
      #
      # Deliberately conservative about what counts as dead:
      #   - branches: only if `git ls-remote` says the ref is gone
      #   - PRs: only if the PR is CLOSED or MERGED
      #   - refs/tags/* and anything unrecognised: never touched HERE. The
      #     original reason still holds for the CURRENT tag, whose cache warms
      #     the repeated rebuilds of a release in progress. What it did not
      #     cover is a tag that has shipped, whose set no other ref can read;
      #     the step above collects those. The caution survives either way: this
      #     step deletes on a liveness signal and a tag is always live, so a
      #     misfire here would be silent.
      - name: Drop caches for deleted branches and closed PRs
        if: ${{ steps.gate.outputs.skip == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Same shape as the step above: listing checked separately from
          # "found nothing", and the loop fed by a here-string so `freed`
          # survives it. It previously ran on the right of a pipe, where the
          # counter accumulated in a subshell and was discarded — harmless while
          # nothing read it, and a trap for whoever printed it next.
          if ! RAW=$(gh cache list --repo "$GITHUB_REPOSITORY" --limit 500 \
                       --json id,key,ref,sizeInBytes); then
            echo "::error::Could not list caches — the dead-ref prune did NOT run."
            exit 1
          fi
          ROWS=$(printf '%s' "$RAW" | jq -r '.[] | "\(.id)\t\(.ref)\t\(.sizeInBytes)\t\(.key)"')
          freed=0
          while IFS=$'\t' read -r id ref size key; do
                [ -n "$id" ] || continue
                dead=""
                case "$ref" in
                  refs/pull/*/merge)
                    num=$(echo "$ref" | sed -E 's#refs/pull/([0-9]+)/merge#\1#')
                    state=$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" \
                              --json state --jq .state 2>/dev/null || echo "")
                    case "$state" in
                      CLOSED|MERGED) dead="PR #$num is $state" ;;
                    esac
                    ;;
                  refs/heads/*)
                    branch="${ref#refs/heads/}"
                    # A tag-scoped entry can surface as refs/heads/refs/tags/X;
                    # ls-remote would report it missing as a branch. Skip those.
                    case "$branch" in
                      refs/tags/*) continue ;;
                    esac
                    if [ -z "$(git ls-remote --heads \
                         "https://github.com/$GITHUB_REPOSITORY" "$branch" 2>/dev/null)" ]; then
                      dead="branch '$branch' no longer exists"
                    fi
                    ;;
                esac
                if [ -n "$dead" ]; then
                  mb=$(( size / 1024 / 1024 ))
                  if err=$(gh cache delete "$id" --repo "$GITHUB_REPOSITORY" 2>&1); then
                    echo "- deleted \`$key\` (${mb} MB) — $dead" >> "$GITHUB_STEP_SUMMARY"
                    freed=$(( freed + mb ))
                  else
                    echo "::warning::Failed to delete cache $key (id $id): $err"
                  fi
                fi
          done <<< "$ROWS"
          echo "Reclaimed ${freed} MB from dead refs." >> "$GITHUB_STEP_SUMMARY"

          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq \
            '"Remaining: \(.active_caches_count) caches, \((.active_caches_size_in_bytes/1073741824)*100|round/100) GB / 10 GB cap"' \
            >> "$GITHUB_STEP_SUMMARY" || true
