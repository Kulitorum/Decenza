name: 'Set up compiler cache'
description: >
  Installs ccache/sccache and wires it to the shared cache, with one switch to
  build genuinely cold. Wraps hendrikmuhs/ccache-action so the cold-build logic
  lives in one place instead of six near-identical copies.

# Why this exists as an action rather than six pasted blocks.
#
# The cold-build switch below is subtle enough to get wrong, and it WAS wrong:
# the first attempt guarded the whole step with `if: inputs.use_cache`, which
# also skipped the thing that INSTALLS ccache — while later steps still invoked
# it. Linux failed with 'ccache: command not found' (exit 127).
#
# The correct shape is to always install the tool and defeat the CACHE instead:
# a key that cannot match restores nothing, and save: false writes nothing.
#
# Six copies of that reasoning had already drifted into two different wordings
# before this action existed, which is exactly how the next person ends up
# fixing five of six call sites. The explanation belongs in one file.

inputs:
  key:
    description: 'Cache key for a warm build. Ignored when use_cache is false.'
    required: true
  use_cache:
    description: >
      'true' for a normal warm build; 'false' for a cold one (nightly). Pass the
      workflow input as a string — composite action inputs are always strings,
      so a boolean workflow input needs no conversion at the call site.
    required: false
    default: 'true'
  variant:
    description: "'ccache' or 'sccache' (Windows/MSVC uses sccache)."
    required: false
    default: 'ccache'
  max-size:
    description: 'Cache size cap passed through to the underlying action.'
    required: false
    default: '500M'
  headroom-gib:
    description: Reserve this much repository cache space; zero keeps existing caller policy
    default: '0'
  extra-budget-mib:
    description: Additional downloads this job may cache, reserved before enabling persistence
    default: '0'
  superseded-prefixes:
    description: Comma-separated key prefixes of this ref's cache entries that this run's other jobs re-save; their bytes offset the headroom
    default: ''
  extra-qt-cache-prefixes:
    description: Comma-separated Qt SDK cache configuration prefixes already covered by extra-budget-mib; bump prefixes when SDK inputs change
    default: ''

outputs:
  cache-budget-ok:
    description: Whether repository headroom permits this job's cached downloads
    value: ${{ steps.budget.outputs.cache != 'false' }}
  cache-enabled:
    description: Whether persistence is enabled after the input and budget checks
    value: ${{ inputs.use_cache != 'false' && steps.budget.outputs.cache != 'false' }}

runs:
  using: composite
  steps:
    - name: Preserve repository cache headroom
      id: budget
      if: ${{ inputs.headroom-gib != '0' }}
      uses: actions/github-script@v9
      env:
        CACHE_HEADROOM_GIB: ${{ inputs.headroom-gib }}
        CACHE_EXTRA_MIB: ${{ inputs.extra-budget-mib }}
        CACHE_EXTRA_QT_PREFIXES: ${{ inputs.extra-qt-cache-prefixes }}
        CACHE_SUPERSEDED_PREFIXES: ${{ inputs.superseded-prefixes }}
        CACHE_MAX_SIZE: ${{ inputs.max-size }}
      with:
        script: |
          try {
            const entries = await github.paginate('GET /repos/{owner}/{repo}/actions/caches', {
              ...context.repo, per_page: 100
            });
            const used = entries.reduce((bytes, entry) => bytes + entry.size_in_bytes, 0);
            const size = process.env.CACHE_MAX_SIZE.match(/^(\d+)([MG])$/);
            if (!size) throw new Error('Budgeted compiler caches require an M or G size');
            const compiler = Number(size[1]) * (size[2] === 'G' ? 1024 ** 3 : 1024 ** 2);
            const extra = Number(process.env.CACHE_EXTRA_MIB) * 1024 ** 2;
            // The caches API lists a tag run's entries under refs/heads/refs/tags/<tag>,
            // while context.ref is refs/tags/<tag>; accept both spellings.
            const thisRef = new Set([context.ref, `refs/heads/${context.ref}`]);
            const refs = new Set([...thisRef,
              `refs/heads/${context.payload.repository.default_branch}`]);
            const kernel = `-${require('os').release()}-`;
            const prefixes = process.env.CACHE_EXTRA_QT_PREFIXES.split(',').map(p => p.trim()).filter(Boolean);
            const restored = prefixes.reduce((bytes, prefix) => {
              const sizes = entries.filter(entry => refs.has(entry.ref)
                && entry.key.startsWith(prefix) && entry.key.includes(kernel))
                .map(entry => entry.size_in_bytes);
              return bytes + (sizes.length ? Math.min(...sizes) : 0);
            }, 0);
            // Entries on this ref that this run's native jobs replace: already in
            // `used`, and dead once the replacement saves.
            const superseded = process.env.CACHE_SUPERSEDED_PREFIXES.split(',').map(p => p.trim()).filter(Boolean);
            const reclaimable = entries.filter(entry => thisRef.has(entry.ref)
                && superseded.some(prefix => entry.key.startsWith(prefix)))
              .reduce((bytes, entry) => bytes + entry.size_in_bytes, 0);
            const reserve = Math.max(0, Number(process.env.CACHE_HEADROOM_GIB) * 1024 ** 3 - reclaimable)
              + Math.max(0, extra - restored) + compiler;
            const enabled = used + reserve <= 10 * 1024 ** 3;
            core.setOutput('cache', String(enabled));
            await core.summary.addRaw(`Repository cache: ${(used / 1024 ** 3).toFixed(2)} GiB `
              + `(${(reclaimable / 1024 ** 3).toFixed(2)} GiB superseded by this run); `
              + `reserved growth/headroom: ${(reserve / 1024 ** 3).toFixed(2)} GiB; `
              + `budget permits persistence: ${enabled}.\n`).write();
            if (!enabled) core.warning('Cache space is reserved for existing native builds; this job will not save caches.');
          } catch (error) {
            core.warning(`Cache budget unavailable; disabling persistence: ${error.message}`);
            core.setOutput('cache', 'false');
          }
    # The pinned version is part of a contract with callers: ccache-action
    # stores each entry under its VARIANT name plus the key it was handed
    # (`ccache-<key>-<timestamp>`, `sccache-<key>-…`), and nightly-sanitizers.yml
    # reconstructs that prefix to find and delete its own entries. A bump that
    # changed the stored key shape would break that reclaim silently — which is
    # exactly how it broke the first time. Check the reclaim filter when bumping.
    - name: Set up ${{ inputs.variant }}
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        variant: ${{ inputs.variant }}
        # Cold whenever the caller says use_cache is false, whatever the
        # trigger. github.run_id makes the key unique per run so it can never
        # restore; save: false means it never writes. The tool itself is still
        # installed, which is the whole point — see the note at the top.
        #
        # This deliberately does NOT check github.event_name. An earlier version
        # required `event_name == 'workflow_dispatch'` for the cold branch,
        # which silently ignored use_cache on every other trigger — so a
        # SCHEDULED job computing "skip the cache, we are low on space" would
        # have been overruled and cached anyway. A caller passing a value is
        # the signal; how the run was triggered is not this action's business.
        #
        # Tag pushes stay warm without needing the event check: the release
        # workflows pass `${{ inputs.use_cache }}`, which is an empty string on
        # a tag push, and empty is not 'false'.
        # Budget pressure only disables saves: restoring an existing compiler
        # cache adds no repository bytes and still avoids repeated compilation.
        key: ${{ inputs.use_cache == 'false' && format('cold-no-restore-{0}', github.run_id) || inputs.key }}
        # Tags save. Do not "optimise" this by suppressing saves on refs/tags/*.
        #
        # That was tried and reverted the same day. The reasoning looked sound:
        # GitHub scopes caches by REF (a run reads its own ref's scope plus the
        # default branch's, and writes only into its own), so a tag's entry is
        # readable by nothing except that same tag — which sounds write-only,
        # and v2.0.0 was holding 3045 MB of it.
        #
        # The premise "a tag builds once" is false here. The release process
        # re-tags at HEAD and force-pushes to fold in late content, so the same
        # tag ref builds repeatedly: v2.0.0 ran NINE macOS builds between
        # 2026-07-22 and 07-24, v2.0.1 two. Every one after the first restored
        # the previous attempt's cache. The sizes show it — v2.0.0's macOS entry
        # reached 1870 MB across nine builds against v2.0.1's 569 MB across two,
        # which is accumulation, not a cold build's footprint.
        #
        # So the tag scope is the HOTTEST cache in the repo, not dead weight —
        # and since main no longer carries a platform compiler cache at all
        # (warm-main-cache.yml is gone; see prune-caches.yml), it is the ONLY
        # one. Suppressing it would make every release build cold, not just the
        # first.
        #
        # The real cost was never the live tag's set; it was the sets left
        # behind by tags that HAVE shipped. prune-caches.yml collects those,
        # keeping the newest tag — the one currently being iterated on.
        save: ${{ inputs.use_cache != 'false' && steps.budget.outputs.cache != 'false' }}
        max-size: ${{ inputs.max-size }}
